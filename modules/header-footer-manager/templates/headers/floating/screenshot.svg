<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120">
  <!-- Background (showing it floats) -->
  <rect x="0" y="0" width="800" height="120" fill="none"/>

  <!-- Floating Container with margins -->
  <rect x="40" y="20" width="720" height="70" rx="35" fill="none" stroke="#94a3b8" stroke-width="2"/>

  <!-- Inner shadow effect (dashed line) -->
  <rect x="42" y="22" width="716" height="66" rx="33" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,2"/>

  <!-- Logo (Left) -->
  <rect x="70" y="40" width="80" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="110" y="58" font-size="10" fill="#94a3b8" text-anchor="middle" font-weight="600">LOGO</text>

  <!-- Navigation Items (Center) -->
  <g transform="translate(280, 55)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="80" y1="0" x2="130" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="160" y1="0" x2="210" y2="0" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Icons and CTA (Right) -->
  <!-- Search Icon -->
  <circle cx="590" cy="55" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="596" y1="61" x2="600" y2="65" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cart Icon -->
  <g transform="translate(625, 55)">
    <rect x="-6" y="-6" width="12" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-4" y1="-6" x2="-5" y2="-9" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="4" y1="-6" x2="5" y2="-9" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="5" cy="-8" r="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- CTA Button -->
  <rect x="665" y="42" width="85" height="26" rx="13" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="707" y="58" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="600">Get Started</text>

  <!-- Margin indicators (small lines showing floating space) -->
  <line x1="20" y1="55" x2="35" y2="55" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="765" y1="55" x2="780" y2="55" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2,2"/>
</svg>
