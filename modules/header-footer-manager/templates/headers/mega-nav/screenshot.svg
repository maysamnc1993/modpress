<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <!-- Top Bar Background -->
  <rect x="0" y="0" width="800" height="80" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Logo -->
  <rect x="30" y="25" width="100" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="80" y="45" font-size="12" fill="#94a3b8" text-anchor="middle" font-weight="600">LOGO</text>

  <!-- Search Bar -->
  <rect x="200" y="25" width="400" height="30" rx="15" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="570" cy="40" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="576" y1="46" x2="581" y2="51" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Icons (Right) -->
  <circle cx="650" cy="40" r="10" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="690" cy="40" r="10" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="730" cy="40" r="10" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <circle cx="740" cy="32" r="5" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Navigation Bar -->
  <rect x="0" y="80" width="800" height="40" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <!-- Menu Items -->
  <line x1="150" y1="100" x2="220" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="280" y1="100" x2="360" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="420" y1="100" x2="480" y2="100" stroke="#94a3b8" stroke-width="2"/>
  <line x1="540" y1="100" x2="620" y2="100" stroke="#94a3b8" stroke-width="2"/>

  <!-- Dropdown Indicators -->
  <path d="M 230 98 L 236 104 L 242 98" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 370 98 L 376 104 L 382 98" stroke="#94a3b8" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Mega Menu Dropdown -->
  <rect x="100" y="130" width="600" height="60" rx="6" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="4,4"/>

  <!-- Mega Menu Grid Items (4 columns) -->
  <rect x="120" y="140" width="120" height="40" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="260" y="140" width="120" height="40" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="400" y="140" width="120" height="40" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="540" y="140" width="120" height="40" rx="4" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Category Images Placeholder -->
  <rect x="125" y="145" width="30" height="30" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="265" y="145" width="30" height="30" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="405" y="145" width="30" height="30" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="545" y="145" width="30" height="30" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Text Lines -->
  <line x1="162" y1="155" x2="230" y2="155" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="162" y1="165" x2="210" y2="165" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="302" y1="155" x2="370" y2="155" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="442" y1="155" x2="510" y2="155" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="582" y1="155" x2="650" y2="155" stroke="#cbd5e1" stroke-width="1"/>
</svg>
