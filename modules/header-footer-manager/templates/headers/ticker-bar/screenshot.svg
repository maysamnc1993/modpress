<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <!-- Background -->
  <rect width="300" height="80" fill="#ffffff"/>

  <!-- Ticker Bar -->
  <rect x="0" y="0" width="300" height="20" fill="#000000"/>
  <!-- Ticker Text -->
  <text x="10" y="13" font-size="7" fill="#ffffff" font-weight="300">📢 Breaking News • Special Offer • Free Shipping</text>
  <!-- Ticker Arrow -->
  <line x1="290" y1="10" x2="295" y2="10" stroke="#ffffff" stroke-width="1" marker-end="url(#arrowhead)"/>

  <!-- Main Header -->
  <rect x="0" y="20" width="300" height="60" fill="#ffffff"/>

  <!-- Logo (Left) -->
  <rect x="20" y="35" width="50" height="20" rx="2" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="45" y="49" font-size="10" fill="#000000" text-anchor="middle" font-weight="300">LOGO</text>

  <!-- Navigation Menu (Center) -->
  <g transform="translate(100, 45)">
    <text x="0" y="0" font-size="8" fill="#000000">Home</text>
    <text x="35" y="0" font-size="8" fill="#000000">Shop</text>
    <text x="65" y="0" font-size="8" fill="#000000">About</text>
    <text x="100" y="0" font-size="8" fill="#000000">Contact</text>
  </g>

  <!-- Icons (Right) -->
  <!-- Search Icon -->
  <circle cx="240" cy="45" r="6" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="244" y1="49" x2="248" y2="53" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cart Icon -->
  <g transform="translate(265, 45)">
    <path d="M -5 -3 L -3 5 L 3 5 L 5 -3" stroke="#000000" stroke-width="1.5" fill="none"/>
    <line x1="-3" y1="-3" x2="-5" y2="-6" stroke="#000000" stroke-width="1.5"/>
    <line x1="3" y1="-3" x2="5" y2="-6" stroke="#000000" stroke-width="1.5"/>
    <circle cx="5" cy="-5" r="3" fill="#000000"/>
    <text x="5" y="-2.5" font-size="4" fill="white" text-anchor="middle">2</text>
  </g>

  <!-- Border -->
  <line x1="0" y1="79" x2="300" y2="79" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Arrow marker definition -->
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffffff"/>
    </marker>
  </defs>
</svg>
