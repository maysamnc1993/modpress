<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Background -->
  <rect width="300" height="100" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Header Container -->
  <rect x="10" y="20" width="280" height="40" fill="none" stroke="#d1d5db" stroke-width="1" rx="2"/>

  <!-- Left Menu Items -->
  <g transform="translate(25, 35)">
    <line x1="0" y1="0" x2="25" y2="0" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="30" y1="0" x2="55" y2="0" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="60" y1="0" x2="80" y2="0" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Center Logo (Large) -->
  <circle cx="150" cy="40" r="18" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="150" y="44" font-size="8" fill="#3b82f6" text-anchor="middle" font-weight="bold">LOGO</text>

  <!-- Right Menu Items -->
  <g transform="translate(195, 35)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="25" y1="0" x2="45" y2="0" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Action Icons (Right) -->
  <g transform="translate(252, 35)">
    <!-- Search Icon -->
    <circle cx="0" cy="0" r="4" fill="none" stroke="#374151" stroke-width="1"/>
    <line x1="3" y1="3" x2="5" y2="5" stroke="#374151" stroke-width="1"/>
  </g>

  <g transform="translate(268, 35)">
    <!-- Cart Icon -->
    <rect x="-3" y="-2" width="6" height="6" fill="none" stroke="#374151" stroke-width="1" rx="0.5"/>
    <line x1="-2" y1="-2" x2="-3" y2="-5" stroke="#374151" stroke-width="1"/>
    <line x1="2" y1="-2" x2="3" y2="-5" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Divider Lines (Dashed) -->
  <line x1="115" y1="30" x2="115" y2="50" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2,2"/>
  <line x1="185" y1="30" x2="185" y2="50" stroke="#d1d5db" stroke-width="1" stroke-dasharray="2,2"/>

  <!-- Labels -->
  <text x="70" y="75" font-size="6" fill="#9ca3af" text-anchor="middle">Left Menu</text>
  <text x="150" y="75" font-size="6" fill="#9ca3af" text-anchor="middle">Center Logo</text>
  <text x="220" y="75" font-size="6" fill="#9ca3af" text-anchor="middle">Right Menu</text>
</svg>
