<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 140">
  <!-- Row 1: Top Info Bar (darker background) -->
  <rect x="0" y="0" width="800" height="40" fill="none" stroke="#94a3b8" stroke-width="1"/>

  <!-- Top Row Left: Message Icon -->
  <g transform="translate(30, 20)">
    <rect x="0" y="-5" width="10" height="8" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="2" y1="-5" x2="5" y2="-2" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="5" y1="-2" x2="8" y2="-5" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="20" y1="0" x2="120" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Phone -->
  <g transform="translate(180, 20)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="10" y1="0" x2="70" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Email -->
  <g transform="translate(280, 20)">
    <rect x="-5" y="-3" width="10" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="10" y1="0" x2="80" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Top Row Right: Social Icons -->
  <g transform="translate(650, 20)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="20" cy="0" r="5" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="40" cy="0" r="5" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Divider -->
  <line x1="710" y1="10" x2="710" y2="30" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Account Link -->
  <g transform="translate(730, 20)">
    <circle cx="0" cy="0" r="5" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <line x1="10" y1="0" x2="50" y2="0" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Row 2: Main Navigation (white background) -->
  <rect x="0" y="40" width="800" height="80" fill="none" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Logo -->
  <rect x="30" y="65" width="120" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="90" y="83" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">LOGO</text>

  <!-- Navigation Menu (Center) -->
  <g transform="translate(280, 80)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="80" y1="0" x2="130" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="160" y1="0" x2="210" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="240" y1="0" x2="280" y2="0" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Right Actions -->
  <!-- Search Icon -->
  <circle cx="620" cy="80" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="626" y1="86" x2="630" y2="90" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Wishlist -->
  <path d="M 655 72 Q 650 68 645 72 L 650 77 L 655 72 Q 660 68 655 72" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Cart with badge -->
  <g transform="translate(680, 80)">
    <rect x="-6" y="-6" width="12" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-4" y1="-6" x2="-5" y2="-9" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="4" y1="-6" x2="5" y2="-9" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="5" cy="-8" r="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- CTA Button -->
  <rect x="710" y="67" width="70" height="26" rx="4" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <text x="745" y="83" font-size="10" fill="#3b82f6" text-anchor="middle" font-weight="600">Get Quote</text>

  <!-- Bottom border/shadow -->
  <line x1="0" y1="120" x2="800" y2="120" stroke="#cbd5e1" stroke-width="1"/>
</svg>
