<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <!-- Background -->
  <rect width="300" height="80" fill="#ffffff"/>

  <!-- Logo (Top Center) -->
  <rect x="125" y="8" width="50" height="16" rx="2" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="150" y="19" font-size="9" fill="#000000" text-anchor="middle" font-weight="300">LOGO</text>

  <!-- Social Icons Row -->
  <g transform="translate(60, 45)">
    <!-- Instagram -->
    <g>
      <circle cx="0" cy="0" r="10" fill="#f3f4f6" stroke="none"/>
      <rect x="-4" y="-4" width="8" height="8" rx="2" fill="none" stroke="#000000" stroke-width="1.2"/>
      <circle cx="0" cy="0" r="2.5" fill="none" stroke="#000000" stroke-width="1.2"/>
      <text x="0" y="16" font-size="5" fill="#000000" text-anchor="middle" font-weight="500">10.5K</text>
    </g>

    <!-- Facebook -->
    <g transform="translate(40, 0)">
      <circle cx="0" cy="0" r="10" fill="#f3f4f6" stroke="none"/>
      <text x="0" y="3" font-size="10" fill="#000000" text-anchor="middle" font-weight="bold">f</text>
      <text x="0" y="16" font-size="5" fill="#000000" text-anchor="middle" font-weight="500">8.2K</text>
    </g>

    <!-- YouTube -->
    <g transform="translate(80, 0)">
      <circle cx="0" cy="0" r="10" fill="#f3f4f6" stroke="none"/>
      <path d="M -4 -3 L -4 3 L 3 0 Z" fill="#000000" stroke="none"/>
      <text x="0" y="16" font-size="5" fill="#000000" text-anchor="middle" font-weight="500">5.1K</text>
    </g>

    <!-- Twitter -->
    <g transform="translate(120, 0)">
      <circle cx="0" cy="0" r="10" fill="#f3f4f6" stroke="none"/>
      <path d="M -3 -1 Q -2 -3, 0 -2 Q 2 -1, 1 1 Q 0 3, -2 2 Q -4 1, -3 -1" fill="#000000" stroke="none"/>
      <text x="0" y="16" font-size="5" fill="#000000" text-anchor="middle" font-weight="500">12.3K</text>
    </g>

    <!-- TikTok -->
    <g transform="translate(160, 0)">
      <circle cx="0" cy="0" r="10" fill="#f3f4f6" stroke="none"/>
      <text x="0" y="3.5" font-size="8" fill="#000000" text-anchor="middle" font-weight="bold">♪</text>
      <text x="0" y="16" font-size="5" fill="#000000" text-anchor="middle" font-weight="500">15.7K</text>
    </g>
  </g>

  <!-- Navigation Menu (Bottom) -->
  <g transform="translate(80, 73)">
    <line x1="0" y1="-10" x2="140" y2="-10" stroke="#e5e7eb" stroke-width="1"/>
    <text x="0" y="0" font-size="7" fill="#000000">Home</text>
    <text x="30" y="0" font-size="7" fill="#000000">About</text>
    <text x="62" y="0" font-size="7" fill="#000000">Portfolio</text>
    <text x="105" y="0" font-size="7" fill="#000000">Contact</text>
  </g>

  <!-- Border -->
  <line x1="0" y1="79" x2="300" y2="79" stroke="#e5e7eb" stroke-width="1"/>
</svg>
