<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Background -->
  <rect width="300" height="100" fill="#ffffff"/>

  <!-- Logo -->
  <rect x="15" y="35" width="60" height="30" rx="4" fill="#2563eb"/>
  <text x="45" y="55" font-size="11" fill="white" text-anchor="middle" font-weight="bold">AGENCY</text>

  <!-- Navigation Menu -->
  <g transform="translate(95, 50)">
    <text x="0" y="0" font-size="8" fill="#111827" font-weight="500">Home</text>
    <text x="35" y="0" font-size="8" fill="#111827" font-weight="500">Services ▾</text>
    <text x="82" y="0" font-size="8" fill="#111827" font-weight="500">Portfolio ▾</text>
    <text x="132" y="0" font-size="8" fill="#111827" font-weight="500">About</text>
    <text x="170" y="0" font-size="8" fill="#111827" font-weight="500">Blog</text>
  </g>

  <!-- CTA Button -->
  <rect x="220" y="42" width="65" height="18" rx="9" fill="#2563eb"/>
  <text x="252" y="54" font-size="8" fill="white" text-anchor="middle" font-weight="bold">Let's Talk →</text>

  <!-- Dropdown Indicator -->
  <rect x="95" y="60" width="50" height="30" rx="4" fill="#f3f4f6" opacity="0.3"/>
  <text x="120" y="72" font-size="6" fill="#6b7280" text-anchor="middle">Web Design</text>
  <text x="120" y="80" font-size="6" fill="#6b7280" text-anchor="middle">Branding</text>
  <text x="120" y="88" font-size="6" fill="#6b7280" text-anchor="middle">Marketing</text>

  <!-- Border -->
  <line x1="0" y1="99" x2="300" y2="99" stroke="#e5e7eb" stroke-width="1"/>
</svg>
