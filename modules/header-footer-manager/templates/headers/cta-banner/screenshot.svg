<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <!-- Background -->
  <rect width="300" height="80" fill="#ffffff"/>

  <!-- CTA Banner -->
  <rect x="0" y="0" width="300" height="25" fill="#000000"/>

  <!-- Banner Text -->
  <text x="50" y="15" font-size="7" fill="#ffffff" font-weight="500">🎉 Limited Time Offer: Get 50% Off!</text>

  <!-- CTA Button -->
  <rect x="215" y="7" width="60" height="12" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <text x="245" y="15" font-size="7" fill="#ffffff" text-anchor="middle" font-weight="600">Shop Now →</text>

  <!-- Close Button -->
  <g transform="translate(285, 12.5)">
    <line x1="-3" y1="-3" x2="3" y2="3" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="3" y1="-3" x2="-3" y2="3" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Main Header -->
  <rect x="0" y="25" width="300" height="55" fill="#ffffff"/>

  <!-- Logo (Left) -->
  <rect x="20" y="40" width="50" height="20" rx="2" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="45" y="54" font-size="10" fill="#000000" text-anchor="middle" font-weight="300">LOGO</text>

  <!-- Navigation Menu (Center) -->
  <g transform="translate(110, 50)">
    <text x="0" y="0" font-size="8" fill="#000000">Home</text>
    <text x="35" y="0" font-size="8" fill="#000000">Shop</text>
    <text x="65" y="0" font-size="8" fill="#000000">About</text>
    <text x="100" y="0" font-size="8" fill="#000000">Contact</text>
  </g>

  <!-- Icons (Right) -->
  <!-- Search Icon -->
  <circle cx="240" cy="50" r="6" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="244" y1="54" x2="248" y2="58" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cart Icon -->
  <g transform="translate(265, 50)">
    <path d="M -5 -3 L -3 5 L 3 5 L 5 -3" stroke="#000000" stroke-width="1.5" fill="none"/>
    <line x1="-3" y1="-3" x2="-5" y2="-6" stroke="#000000" stroke-width="1.5"/>
    <line x1="3" y1="-3" x2="5" y2="-6" stroke="#000000" stroke-width="1.5"/>
    <circle cx="5" cy="-5" r="3" fill="#000000"/>
    <text x="5" y="-2.5" font-size="4" fill="white" text-anchor="middle">2</text>
  </g>

  <!-- Borders -->
  <line x1="0" y1="24.5" x2="300" y2="24.5" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="0" y1="79" x2="300" y2="79" stroke="#e5e7eb" stroke-width="1"/>
</svg>
