<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <!-- Background -->
  <rect width="300" height="80" fill="#ffffff"/>

  <!-- Hamburger Menu (Left) -->
  <g transform="translate(20, 35)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="7" x2="20" y2="7" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="20" y2="14" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Centered Logo -->
  <rect x="125" y="30" width="50" height="20" rx="2" fill="#000000"/>
  <text x="150" y="44" font-size="10" fill="white" text-anchor="middle" font-weight="300">LOGO</text>

  <!-- Icons (Right) -->
  <!-- Search Icon -->
  <circle cx="220" cy="40" r="7" fill="none" stroke="#000000" stroke-width="1.5"/>
  <line x1="225" y1="45" x2="229" y2="49" stroke="#000000" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Cart Icon -->
  <g transform="translate(245, 40)">
    <path d="M -6 -4 L -4 6 L 4 6 L 6 -4" stroke="#000000" stroke-width="1.5" fill="none"/>
    <line x1="-4" y1="-4" x2="-6" y2="-8" stroke="#000000" stroke-width="1.5"/>
    <line x1="4" y1="-4" x2="6" y2="-8" stroke="#000000" stroke-width="1.5"/>
    <!-- Cart Badge -->
    <circle cx="6" cy="-6" r="4" fill="#000000"/>
    <text x="6" y="-3" font-size="5" fill="white" text-anchor="middle">2</text>
  </g>

  <!-- Border -->
  <line x1="0" y1="79" x2="300" y2="79" stroke="#f3f4f6" stroke-width="1"/>
</svg>
