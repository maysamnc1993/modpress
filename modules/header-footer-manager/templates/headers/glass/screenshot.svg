<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 100">
  <!-- Glass effect border (main container) -->
  <rect x="0" y="0" width="800" height="100" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Subtle inner border for glass effect -->
  <rect x="1" y="1" width="798" height="98" fill="none" stroke="#f1f5f9" stroke-width="1" opacity="0.5"/>

  <!-- Logo (Left) -->
  <rect x="30" y="35" width="90" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="2"/>
  <text x="75" y="53" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="600">LOGO</text>

  <!-- Navigation Items (Center-Right) -->
  <g transform="translate(300, 50)">
    <line x1="0" y1="0" x2="50" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="80" y1="0" x2="130" y2="0" stroke="#94a3b8" stroke-width="2"/>
    <line x1="160" y1="0" x2="200" y2="0" stroke="#94a3b8" stroke-width="2"/>
  </g>

  <!-- Social Icons (Right side, before other icons) -->
  <g transform="translate(620, 50)">
    <circle cx="0" cy="0" r="6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="20" cy="0" r="6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <circle cx="40" cy="0" r="6" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Divider line -->
  <line x1="675" y1="35" x2="675" y2="65" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Action Icons (Far Right) -->
  <!-- Search -->
  <circle cx="700" cy="50" r="7" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="705" y1="55" x2="709" y2="59" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Account -->
  <circle cx="730" cy="50" r="8" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <circle cx="730" cy="48" r="3" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  <path d="M 723 54 Q 730 52 737 54" stroke="#94a3b8" stroke-width="1.5" fill="none"/>

  <!-- Cart with badge -->
  <g transform="translate(760, 50)">
    <rect x="-6" y="-6" width="12" height="8" rx="1" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="-4" y1="-6" x2="-5" y2="-9" stroke="#94a3b8" stroke-width="1.5"/>
    <line x1="4" y1="-6" x2="5" y2="-9" stroke="#94a3b8" stroke-width="1.5"/>
    <circle cx="5" cy="-8" r="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  </g>

  <!-- Glass effect indicators (blur suggestion lines) -->
  <line x1="10" y1="10" x2="80" y2="10" stroke="#e0e7ff" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="90" x2="80" y2="90" stroke="#e0e7ff" stroke-width="1" opacity="0.6"/>
</svg>
