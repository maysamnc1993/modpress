<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Gradient Top Bar -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Top Announcement Bar -->
  <rect width="300" height="20" fill="url(#grad1)"/>
  <text x="150" y="13" font-size="6" fill="#ffffff" text-anchor="middle">🎉 محصول جدید ما را امتحان کنید - 30 روز رایگان!</text>

  <!-- Main Header -->
  <rect y="20" width="300" height="60" fill="#ffffff"/>

  <!-- Logo -->
  <circle cx="30" cy="50" r="12" fill="url(#grad2)"/>
  <text x="30" y="54" font-size="8" fill="white" text-anchor="middle" font-weight="bold">S</text>
  <text x="50" y="54" font-size="9" fill="#1e293b" font-weight="bold">Startup</text>

  <!-- Navigation -->
  <text x="120" y="53" font-size="8" fill="#1e293b">خدمات</text>
  <text x="155" y="53" font-size="8" fill="#1e293b">محصولات</text>
  <text x="195" y="53" font-size="8" fill="#1e293b">قیمت‌گذاری</text>

  <!-- Action Buttons -->
  <rect x="215" y="42" width="35" height="16" rx="8" fill="none" stroke="#8b5cf6" stroke-width="1.5"/>
  <text x="232" y="52" font-size="7" fill="#8b5cf6" text-anchor="middle">مشاهده دمو</text>

  <rect x="255" y="42" width="35" height="16" rx="8" fill="url(#grad2)"/>
  <text x="272" y="52" font-size="7" fill="white" text-anchor="middle">شروع رایگان</text>

  <!-- Border -->
  <line x1="0" y1="80" x2="300" y2="80" stroke="#e2e8f0" stroke-width="1"/>
</svg>
