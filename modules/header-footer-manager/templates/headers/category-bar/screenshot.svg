<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <!-- Background -->
  <rect width="300" height="80" fill="#ffffff"/>

  <!-- Main Header -->
  <rect x="0" y="0" width="300" height="50" fill="#ffffff"/>

  <!-- Logo (Left) -->
  <rect x="15" y="20" width="40" height="15" rx="2" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="35" y="30.5" font-size="8" fill="#000000" text-anchor="middle" font-weight="300">LOGO</text>

  <!-- Search Bar (Center) -->
  <rect x="80" y="18" width="120" height="20" rx="10" fill="none" stroke="#e5e7eb" stroke-width="1.5"/>
  <circle cx="93" cy="28" r="4.5" fill="none" stroke="#9ca3af" stroke-width="1.2"/>
  <line x1="96" y1="31" x2="98" y2="33" stroke="#9ca3af" stroke-width="1.2" stroke-linecap="round"/>
  <text x="110" y="30" font-size="7" fill="#9ca3af">Search products...</text>

  <!-- Icons (Right) -->
  <!-- Wishlist -->
  <g transform="translate(220, 28)">
    <path d="M 0 -2 C -2 -4, -5 -4, -5 -1 C -5 2, 0 5, 0 5 C 0 5, 5 2, 5 -1 C 5 -4, 2 -4, 0 -2 Z" fill="none" stroke="#000000" stroke-width="1.3"/>
  </g>

  <!-- Cart -->
  <g transform="translate(245, 28)">
    <path d="M -5 -3 L -3 5 L 3 5 L 5 -3" stroke="#000000" stroke-width="1.3" fill="none"/>
    <line x1="-3" y1="-3" x2="-5" y2="-6" stroke="#000000" stroke-width="1.3"/>
    <line x1="3" y1="-3" x2="5" y2="-6" stroke="#000000" stroke-width="1.3"/>
    <circle cx="5" cy="-5" r="3" fill="#000000"/>
    <text x="5" y="-2.5" font-size="4" fill="white" text-anchor="middle">2</text>
  </g>

  <!-- Account -->
  <circle cx="270" cy="28" r="5" fill="none" stroke="#000000" stroke-width="1.3"/>
  <path d="M 270 30 C 270 28, 268 26, 270 26 C 272 26, 270 28, 270 30" fill="none" stroke="#000000" stroke-width="1.3"/>

  <!-- Category Bar -->
  <rect x="0" y="50" width="300" height="30" fill="#f9fafb"/>

  <!-- Menu Icon + Text -->
  <g transform="translate(20, 65)">
    <rect x="-3" y="-2" width="3" height="3" fill="none" stroke="#000000" stroke-width="1"/>
    <rect x="-3" y="1.5" width="3" height="3" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="6" y="2.5" font-size="7" fill="#000000">All</text>
  </g>

  <!-- Category Pills -->
  <g transform="translate(50, 65)">
    <rect x="0" y="-6" width="38" height="12" rx="6" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="8" cy="0" r="3" fill="none" stroke="#000000" stroke-width="1"/>
    <line x1="10" y1="0" x2="11" y2="1" stroke="#000000" stroke-width="1"/>
    <text x="14" y="2.5" font-size="7" fill="#000000">Fashion</text>
  </g>

  <g transform="translate(100, 65)">
    <rect x="0" y="-6" width="38" height="12" rx="6" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="8" y="-3" width="6" height="6" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="17" y="2.5" font-size="7" fill="#000000">Home</text>
  </g>

  <g transform="translate(150, 65)">
    <rect x="0" y="-6" width="45" height="12" rx="6" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <path d="M 8 -2 L 11 0 L 8 2" fill="none" stroke="#000000" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="14" y="2.5" font-size="7" fill="#000000">Electronics</text>
  </g>

  <g transform="translate(207, 65)">
    <rect x="0" y="-6" width="35" height="12" rx="6" fill="none" stroke="#e5e7eb" stroke-width="1"/>
    <rect x="7" y="-3" width="5" height="7" rx="0.5" fill="none" stroke="#000000" stroke-width="1"/>
    <text x="15" y="2.5" font-size="7" fill="#000000">Books</text>
  </g>

  <!-- Border -->
  <line x1="0" y1="49.5" x2="300" y2="49.5" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="0" y1="79" x2="300" y2="79" stroke="#e5e7eb" stroke-width="1"/>
</svg>
