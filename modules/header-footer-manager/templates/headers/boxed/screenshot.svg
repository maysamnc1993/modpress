<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Background -->
  <rect width="300" height="100" fill="#f9fafb"/>

  <!-- Outer spacing indicator -->
  <line x1="20" y1="5" x2="20" y2="15" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="280" y1="5" x2="280" y2="15" stroke="#9ca3af" stroke-width="0.5" stroke-dasharray="2,2"/>
  <line x1="20" y1="10" x2="280" y2="10" stroke="#9ca3af" stroke-width="0.5" marker-end="url(#arrowhead)"/>

  <!-- Boxed Header Container with shadow -->
  <!-- Shadow -->
  <rect x="23" y="23" width="254" height="54" fill="#00000010" rx="8"/>

  <!-- Main Box -->
  <rect x="20" y="20" width="254" height="54" fill="#ffffff" stroke="#d1d5db" stroke-width="2" rx="8"/>

  <!-- Inner Content -->
  <g transform="translate(30, 47)">
    <!-- Logo -->
    <rect x="0" y="-10" width="40" height="14" fill="none" stroke="#3b82f6" stroke-width="1.5" rx="2"/>
    <text x="20" y="0" font-size="6" fill="#3b82f6" text-anchor="middle" font-weight="bold">LOGO</text>

    <!-- Menu Items -->
    <g transform="translate(60, 0)">
      <line x1="0" y1="-5" x2="25" y2="-5" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="32" y1="-5" x2="52" y2="-5" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="59" y1="-5" x2="84" y2="-5" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
      <line x1="91" y1="-5" x2="111" y2="-5" stroke="#6b7280" stroke-width="1.5" stroke-linecap="round"/>
    </g>

    <!-- Action Icons -->
    <g transform="translate(200, 0)">
      <!-- Search -->
      <circle cx="0" cy="-5" r="4" fill="none" stroke="#374151" stroke-width="1"/>
      <line x1="3" y1="-2" x2="5" y2="0" stroke="#374151" stroke-width="1"/>

      <!-- Cart -->
      <g transform="translate(18, -5)">
        <rect x="-3" y="-2" width="6" height="6" fill="none" stroke="#374151" stroke-width="1" rx="0.5"/>
        <line x1="-2" y1="-2" x2="-3" y2="-5" stroke="#374151" stroke-width="1"/>
        <line x1="2" y1="-2" x2="3" y2="-5" stroke="#374151" stroke-width="1"/>
      </g>
    </g>
  </g>

  <!-- Margin indicators -->
  <g transform="translate(150, 85)">
    <text x="0" y="0" font-size="5" fill="#9ca3af" text-anchor="middle">Boxed with Shadow</text>
    <line x1="-30" y1="3" x2="-20" y2="3" stroke="#9ca3af" stroke-width="0.5"/>
    <text x="-25" y="2" font-size="4" fill="#9ca3af" text-anchor="middle">margin</text>

    <line x1="20" y1="3" x2="30" y2="3" stroke="#9ca3af" stroke-width="0.5"/>
    <text x="25" y="2" font-size="4" fill="#9ca3af" text-anchor="middle">margin</text>
  </g>

  <!-- Corner radius indicator -->
  <g transform="translate(24, 24)">
    <path d="M 0,8 Q 0,0 8,0" fill="none" stroke="#3b82f6" stroke-width="1" stroke-dasharray="2,2"/>
    <text x="4" y="10" font-size="3" fill="#3b82f6">radius</text>
  </g>
</svg>
