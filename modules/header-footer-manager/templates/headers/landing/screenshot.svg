<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <defs>
    <linearGradient id="landingGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Transparent/White Background -->
  <rect width="300" height="80" fill="#ffffff" fill-opacity="0.95"/>

  <!-- Main Header -->
  <rect width="300" height="80" fill="transparent"/>

  <!-- Logo -->
  <circle cx="30" cy="40" r="14" fill="url(#landingGrad)"/>
  <text x="30" y="45" font-size="10" fill="white" text-anchor="middle" font-weight="bold">L</text>
  <text x="52" y="44" font-size="10" fill="#1e293b" font-weight="bold">Landing</text>

  <!-- Navigation Links (Minimalist) -->
  <text x="120" y="42" font-size="7" fill="#64748b">ویژگی‌ها</text>
  <text x="160" y="42" font-size="7" fill="#64748b">مزایا</text>
  <text x="195" y="42" font-size="7" fill="#64748b">قیمت‌گذاری</text>

  <!-- Login Link -->
  <text x="235" y="42" font-size="7" fill="#64748b">ورود</text>

  <!-- CTA Button (Prominent) -->
  <rect x="252" y="30" width="40" height="20" rx="10" fill="url(#landingGrad)"/>
  <text x="272" y="43" font-size="7" fill="white" text-anchor="middle" font-weight="bold">شروع کنید →</text>

  <!-- Optional shadow effect for depth -->
  <ellipse cx="150" cy="78" rx="120" ry="3" fill="#000000" opacity="0.05"/>
</svg>
