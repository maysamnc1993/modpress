<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110">
  <!-- Top Bar -->
  <rect width="300" height="22" fill="#f9fafb"/>
  <text x="10" y="14" font-size="6" fill="#374151" font-weight="bold">Trending:</text>
  <text x="50" y="14" font-size="6" fill="#374151">Article Title One • Article Title Two</text>
  <text x="230" y="14" font-size="5" fill="#6b7280">Follow us:</text>
  <circle cx="268" cy="11" r="4" fill="#6b7280"/>
  <circle cx="278" cy="11" r="4" fill="#6b7280"/>
  <circle cx="288" cy="11" r="4" fill="#6b7280"/>

  <!-- Main Header -->
  <rect y="22" width="300" height="60" fill="#ffffff"/>

  <!-- Logo -->
  <rect x="15" y="40" width="55" height="24" rx="3" fill="#111827"/>
  <text x="42" y="56" font-size="10" fill="white" text-anchor="middle" font-weight="bold">BLOG</text>

  <!-- Navigation Menu -->
  <text x="90" y="54" font-size="7" fill="#111827" font-weight="600">Home</text>
  <text x="125" y="54" font-size="7" fill="#111827" font-weight="600">Categories ▾</text>
  <text x="180" y="54" font-size="7" fill="#111827" font-weight="600">About</text>
  <text x="215" y="54" font-size="7" fill="#111827" font-weight="600">Contact</text>

  <!-- Search Icon -->
  <circle cx="258" cy="52" r="6" fill="none" stroke="#111827" stroke-width="1.2"/>
  <line x1="262" y1="56" x2="265" y2="59" stroke="#111827" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Account Icon -->
  <circle cx="275" cy="52" r="8" fill="none" stroke="#111827" stroke-width="1.2"/>
  <circle cx="275" cy="50" r="2.5" fill="#111827"/>
  <path d="M 270 56 Q 275 53 280 56" stroke="#111827" stroke-width="1.2" fill="none"/>

  <!-- Subscribe Button -->
  <rect x="232" y="66" width="55" height="14" rx="7" fill="#2563eb"/>
  <text x="259" y="75" font-size="7" fill="white" text-anchor="middle" font-weight="bold">✉ Subscribe</text>

  <!-- Categories Dropdown -->
  <rect x="125" y="62" width="50" height="35" rx="4" fill="#f9fafb" opacity="0.4"/>
  <text x="150" y="72" font-size="5" fill="#6b7280" text-anchor="middle">Technology (12)</text>
  <text x="150" y="79" font-size="5" fill="#6b7280" text-anchor="middle">Lifestyle (8)</text>
  <text x="150" y="86" font-size="5" fill="#6b7280" text-anchor="middle">Business (15)</text>
  <text x="150" y="93" font-size="5" fill="#6b7280" text-anchor="middle">Travel (6)</text>

  <!-- Borders -->
  <line x1="0" y1="22" x2="300" y2="22" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="0" y1="82" x2="300" y2="82" stroke="#e5e7eb" stroke-width="1"/>
</svg>
