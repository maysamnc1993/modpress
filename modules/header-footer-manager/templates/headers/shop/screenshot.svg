<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 130">
  <!-- Top Bar -->
  <rect width="300" height="20" fill="#2563eb"/>
  <text x="10" y="13" font-size="6" fill="#ffffff">🚚 Free Shipping Over $50</text>
  <text x="240" y="13" font-size="6" fill="#ffffff">☎ Contact</text>

  <!-- Main Header -->
  <rect y="20" width="300" height="50" fill="#ffffff"/>

  <!-- Logo -->
  <rect x="10" y="35" width="50" height="20" rx="3" fill="#2563eb"/>
  <text x="35" y="48" font-size="9" fill="white" text-anchor="middle" font-weight="bold">SHOP</text>

  <!-- Search Bar -->
  <rect x="70" y="35" width="130" height="20" rx="10" fill="#f3f4f6" stroke="#d1d5db" stroke-width="1"/>
  <circle cx="82" cy="45" r="5" fill="#9ca3af"/>
  <text x="120" y="48" font-size="7" fill="#6b7280" text-anchor="middle">Search products...</text>

  <!-- Wishlist Icon -->
  <circle cx="215" cy="45" r="10" fill="#f3f4f6"/>
  <path d="M 215 40 L 218 47 L 212 47 Z" fill="#ef4444"/>
  <text x="215" y="60" font-size="5" fill="#6b7280" text-anchor="middle">Wishlist</text>

  <!-- Cart Icon -->
  <circle cx="245" cy="45" r="10" fill="#2563eb"/>
  <path d="M 240 43 L 243 50 L 247 50 L 250 43" stroke="white" stroke-width="1.5" fill="none"/>
  <circle cx="252" cy="38" r="4" fill="#ef4444"/>
  <text x="252" y="41" font-size="5" fill="white" text-anchor="middle">3</text>
  <text x="245" y="60" font-size="5" fill="#6b7280" text-anchor="middle">Cart</text>

  <!-- Account Icon -->
  <circle cx="275" cy="45" r="10" fill="#f3f4f6"/>
  <circle cx="275" cy="43" r="3" fill="#6b7280"/>
  <path d="M 270 50 Q 275 47 280 50" stroke="#6b7280" stroke-width="1.5" fill="none"/>
  <text x="275" y="60" font-size="5" fill="#6b7280" text-anchor="middle">Account</text>

  <!-- Categories Bar -->
  <rect y="70" width="300" height="35" fill="#f9fafb"/>
  <rect x="10" y="78" width="80" height="18" rx="9" fill="#2563eb"/>
  <text x="50" y="90" font-size="7" fill="white" text-anchor="middle">All Categories ▾</text>

  <!-- Nav Menu -->
  <text x="110" y="90" font-size="7" fill="#374151">Home</text>
  <text x="145" y="90" font-size="7" fill="#374151">Shop</text>
  <text x="175" y="90" font-size="7" fill="#374151">About</text>
  <text x="210" y="90" font-size="7" fill="#374151">Contact</text>

  <!-- Special Offers -->
  <text x="260" y="90" font-size="7" fill="#dc2626" font-weight="bold">🏷 Special Offers</text>

  <!-- Borders -->
  <line x1="0" y1="20" x2="300" y2="20" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="0" y1="70" x2="300" y2="70" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="0" y1="105" x2="300" y2="105" stroke="#e5e7eb" stroke-width="1"/>
</svg>
