<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 120">
  <!-- Top Bar -->
  <rect width="300" height="20" fill="#1e293b"/>
  <text x="10" y="13" font-size="6" fill="#ffffff">ساعت کاری: 8-18</text>
  <text x="90" y="13" font-size="6" fill="#ffffff">📞 021-12345678</text>
  <text x="180" y="13" font-size="6" fill="#ffffff">✉ info@company.com</text>
  <circle cx="275" cy="10" r="4" fill="#3b82f6"/>
  <circle cx="265" cy="10" r="4" fill="#0ea5e9"/>
  <circle cx="255" cy="10" r="4" fill="#06b6d4"/>

  <!-- Main Header -->
  <rect y="20" width="300" height="50" fill="#ffffff"/>
  <rect x="10" y="32" width="60" height="26" rx="4" fill="#2563eb"/>
  <text x="40" y="48" font-size="10" fill="white" text-anchor="middle" font-weight="bold">LOGO</text>

  <!-- Navigation -->
  <text x="100" y="48" font-size="8" fill="#1e293b">خانه</text>
  <text x="130" y="48" font-size="8" fill="#1e293b">خدمات</text>
  <text x="165" y="48" font-size="8" fill="#1e293b">محصولات</text>
  <text x="205" y="48" font-size="8" fill="#1e293b">تماس</text>

  <!-- CTA Button -->
  <rect x="250" y="37" width="40" height="18" rx="9" fill="#2563eb"/>
  <text x="270" y="49" font-size="7" fill="white" text-anchor="middle">تماس با ما</text>

  <!-- Department Bar -->
  <rect y="70" width="300" height="30" fill="#f1f5f9"/>
  <rect x="10" y="78" width="80" height="14" rx="7" fill="#64748b"/>
  <text x="50" y="88" font-size="7" fill="white" text-anchor="middle">دپارتمان‌ها ▼</text>

  <text x="110" y="88" font-size="7" fill="#475569">درباره ما</text>
  <text x="155" y="88" font-size="7" fill="#475569">خدمات</text>
  <text x="195" y="88" font-size="7" fill="#475569">نمونه کارها</text>
  <text x="250" y="88" font-size="7" fill="#475569">وبلاگ</text>

  <!-- Border -->
  <line x1="0" y1="70" x2="300" y2="70" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="0" y1="100" x2="300" y2="100" stroke="#e2e8f0" stroke-width="1"/>
</svg>
