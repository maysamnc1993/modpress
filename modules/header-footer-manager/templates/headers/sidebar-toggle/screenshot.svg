<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Background -->
  <rect width="300" height="100" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Header Container -->
  <rect x="10" y="10" width="280" height="30" fill="none" stroke="#d1d5db" stroke-width="1" rx="2"/>

  <!-- Hamburger Menu (Left) -->
  <g transform="translate(20, 20)">
    <line x1="0" y1="2" x2="12" y2="2" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="7" x2="12" y2="7" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="0" y1="12" x2="12" y2="12" stroke="#374151" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Logo (Center) -->
  <rect x="130" y="18" width="40" height="14" fill="none" stroke="#3b82f6" stroke-width="1.5" rx="2"/>
  <text x="150" y="28" font-size="6" fill="#3b82f6" text-anchor="middle" font-weight="bold">LOGO</text>

  <!-- Cart Icon (Right) -->
  <g transform="translate(260, 20)">
    <rect x="0" y="3" width="8" height="8" fill="none" stroke="#374151" stroke-width="1" rx="1"/>
    <line x1="2" y1="3" x2="1" y2="0" stroke="#374151" stroke-width="1"/>
    <line x1="6" y1="3" x2="7" y2="0" stroke="#374151" stroke-width="1"/>
  </g>

  <!-- Sidebar (Right Side) -->
  <rect x="200" y="50" width="90" height="45" fill="none" stroke="#3b82f6" stroke-width="2" rx="2"/>

  <!-- Sidebar Header -->
  <line x1="200" y1="60" x2="290" y2="60" stroke="#d1d5db" stroke-width="1"/>
  <text x="245" y="57" font-size="5" fill="#6b7280" text-anchor="middle">Sidebar</text>

  <!-- Sidebar Menu Items (Lines) -->
  <line x1="210" y1="68" x2="280" y2="68" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <line x1="210" y1="74" x2="280" y2="74" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <line x1="210" y1="80" x2="280" y2="80" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>
  <line x1="210" y1="86" x2="280" y2="86" stroke="#d1d5db" stroke-width="1" stroke-linecap="round"/>

  <!-- Arrow indicator -->
  <g transform="translate(175, 70)">
    <line x1="0" y1="0" x2="10" y2="0" stroke="#9ca3af" stroke-width="1" stroke-dasharray="2,2"/>
    <polyline points="7,-2 10,0 7,2" fill="none" stroke="#9ca3af" stroke-width="1"/>
  </g>
</svg>
