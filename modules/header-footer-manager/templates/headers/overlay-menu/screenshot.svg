<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80">
  <!-- Background -->
  <rect width="300" height="80" fill="#ffffff"/>

  <!-- Hamburger Menu (Left) -->
  <g transform="translate(20, 35)">
    <line x1="0" y1="0" x2="20" y2="0" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="7" x2="20" y2="7" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
    <line x1="0" y1="14" x2="20" y2="14" stroke="#000000" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Centered Logo -->
  <rect x="125" y="30" width="50" height="20" rx="2" fill="none" stroke="#000000" stroke-width="1.5"/>
  <text x="150" y="44" font-size="10" fill="#000000" text-anchor="middle" font-weight="300">LOGO</text>

  <!-- Overlay Preview (Bottom Right Corner) -->
  <g opacity="0.4">
    <rect x="180" y="0" width="120" height="80" fill="#000000"/>
    <!-- Menu Items -->
    <line x1="200" y1="20" x2="270" y2="20" stroke="#ffffff" stroke-width="2"/>
    <line x1="200" y1="32" x2="260" y2="32" stroke="#ffffff" stroke-width="2"/>
    <line x1="200" y1="44" x2="280" y2="44" stroke="#ffffff" stroke-width="2"/>
    <!-- Close Icon -->
    <line x1="190" y1="10" x2="196" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="196" y1="10" x2="190" y2="16" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round"/>
  </g>

  <!-- Border -->
  <line x1="0" y1="79" x2="300" y2="79" stroke="#e5e7eb" stroke-width="1"/>
</svg>
