<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100">
  <!-- Top Info Bar -->
  <rect width="300" height="20" fill="#0f172a"/>
  <text x="10" y="13" font-size="6" fill="#ffffff">🕒 9:00 - 23:00</text>
  <text x="80" y="13" font-size="6" fill="#ffffff">📍 تهران، خیابان ولیعصر</text>
  <text x="190" y="13" font-size="6" fill="#ffffff">📞 021-12345678</text>
  <circle cx="275" cy="10" r="3" fill="#ffffff" fill-opacity="0.8"/>
  <circle cx="285" cy="10" r="3" fill="#ffffff" fill-opacity="0.8"/>

  <!-- Main Header -->
  <rect y="20" width="300" height="60" fill="#ffffff"/>

  <!-- Logo (Restaurant Style) -->
  <circle cx="40" cy="50" r="18" fill="#f97316"/>
  <text x="40" y="48" font-size="12" text-anchor="middle">🍴</text>
  <text x="40" y="60" font-size="5" fill="white" text-anchor="middle">RESTO</text>
  <text x="70" y="54" font-size="11" fill="#1e293b" font-weight="bold">رستوران</text>

  <!-- Navigation -->
  <text x="130" y="53" font-size="8" fill="#1e293b">خانه</text>
  <text x="160" y="53" font-size="8" fill="#1e293b">درباره ما</text>
  <text x="200" y="53" font-size="8" fill="#1e293b">تماس</text>

  <!-- Menu Icon -->
  <rect x="215" y="44" width="8" height="2" rx="1" fill="#64748b"/>
  <rect x="215" y="49" width="8" height="2" rx="1" fill="#64748b"/>
  <rect x="215" y="54" width="8" height="2" rx="1" fill="#64748b"/>
  <text x="228" y="53" font-size="7" fill="#64748b">منو</text>

  <!-- Cart Icon -->
  <circle cx="248" cy="50" r="10" fill="#f1f5f9"/>
  <path d="M 244 48 L 246 48 L 247 54 L 249 54 L 250 48 L 252 48" stroke="#64748b" stroke-width="1.2" fill="none"/>
  <circle cx="246" cy="55" r="0.8" fill="#64748b"/>
  <circle cx="249" cy="55" r="0.8" fill="#64748b"/>

  <!-- Reservation Button -->
  <rect x="258" y="42" width="35" height="16" rx="8" fill="#f97316"/>
  <text x="275" y="52" font-size="7" fill="white" text-anchor="middle">📅 رزرو میز</text>

  <!-- Border -->
  <line x1="0" y1="80" x2="300" y2="80" stroke="#e2e8f0" stroke-width="1"/>
</svg>
