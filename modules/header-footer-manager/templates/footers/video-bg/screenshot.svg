<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Layer -->
  <rect width="800" height="480" fill="#1e293b" stroke="#334155" stroke-width="1"/>

  <!-- Video/Image Pattern (representing background) -->
  <defs>
    <pattern id="videoPattern" x="0" y="0" width="60" height="60" patternUnits="userSpaceOnUse">
      <rect width="60" height="60" fill="none" stroke="#475569" stroke-width="0.5" opacity="0.3"/>
      <line x1="0" y1="30" x2="60" y2="30" stroke="#475569" stroke-width="0.5" opacity="0.3"/>
      <line x1="30" y1="0" x2="30" y2="60" stroke="#475569" stroke-width="0.5" opacity="0.3"/>
    </pattern>
  </defs>
  <rect width="800" height="480" fill="url(#videoPattern)"/>

  <!-- Overlay representation -->
  <rect width="800" height="480" fill="#000000" opacity="0.4"/>

  <!-- CTA Section -->
  <g transform="translate(150, 80)">
    <!-- Title -->
    <rect x="80" y="0" width="340" height="16" rx="2" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="120" y="25" width="260" height="10" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="100" y="42" width="300" height="10" rx="2" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- CTA Button -->
    <rect x="170" y="70" width="160" height="40" rx="8" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
    <rect x="210" y="82" width="80" height="12" rx="2" fill="none" stroke="#06b6d4" stroke-width="1.5"/>
  </g>

  <!-- Divider -->
  <line x1="60" y1="220" x2="740" y2="220" stroke="#475569" stroke-width="1" opacity="0.5"/>

  <!-- Footer Content -->
  <g transform="translate(60, 250)">
    <!-- Column 1: Logo & About -->
    <rect x="0" y="0" width="100" height="20" rx="4" fill="none" stroke="#ffffff" stroke-width="2"/>
    <rect x="0" y="30" width="140" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="42" width="130" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="0" y="54" width="125" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Social Icons -->
    <circle cx="10" cy="85" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="38" cy="85" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>
    <circle cx="66" cy="85" r="10" fill="none" stroke="#ffffff" stroke-width="2"/>

    <!-- Column 2: Quick Links -->
    <rect x="190" y="0" width="80" height="10" rx="1" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="190" y="20" width="60" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="190" y="32" width="55" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="190" y="44" width="50" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="190" y="56" width="58" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Column 3: Services -->
    <rect x="350" y="0" width="80" height="10" rx="1" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="350" y="20" width="60" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="350" y="32" width="55" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <rect x="350" y="44" width="50" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>

    <!-- Column 4: Contact -->
    <rect x="510" y="0" width="80" height="10" rx="1" fill="none" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="518" cy="27" r="4" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="528" y="23" width="100" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="518" cy="41" r="4" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="528" y="37" width="80" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
    <circle cx="518" cy="55" r="4" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="528" y="51" width="90" height="6" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  </g>

  <!-- Bottom Bar -->
  <line x1="60" y1="400" x2="740" y2="400" stroke="#475569" stroke-width="1" opacity="0.5"/>
  <rect x="60" y="415" width="200" height="8" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="550" y="415" width="90" height="8" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="650" y="415" width="90" height="8" rx="1" fill="none" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Video Play Icon (to indicate video background) -->
  <g transform="translate(20, 20)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.7"/>
    <path d="M15 12 L28 20 L15 28 Z" fill="none" stroke="#06b6d4" stroke-width="2" opacity="0.7"/>
  </g>
</svg>
