<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#0f172a"/>

  <!-- Statistics Section -->
  <g transform="translate(100, 40)">
    <!-- Section Title -->
    <rect x="150" y="0" width="300" height="20" rx="4" stroke="#f1f5f9" stroke-width="2"/>
    <rect x="180" y="30" width="240" height="12" rx="3" stroke="#cbd5e1" stroke-width="1.5"/>
    <rect x="200" y="48" width="200" height="12" rx="3" stroke="#cbd5e1" stroke-width="1.5"/>

    <!-- Stats Grid (4 columns) -->
    <g transform="translate(0, 100)">
      <!-- Stat 1 -->
      <g transform="translate(0, 0)">
        <rect x="30" y="0" width="90" height="32" rx="4" stroke="#06b6d4" stroke-width="3"/>
        <rect x="40" y="45" width="70" height="10" rx="2" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="45" y="60" width="60" height="8" rx="2" stroke="#cbd5e1" stroke-width="1"/>
      </g>

      <!-- Stat 2 -->
      <g transform="translate(150, 0)">
        <rect x="30" y="0" width="90" height="32" rx="4" stroke="#06b6d4" stroke-width="3"/>
        <rect x="40" y="45" width="70" height="10" rx="2" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="35" y="60" width="80" height="8" rx="2" stroke="#cbd5e1" stroke-width="1"/>
      </g>

      <!-- Stat 3 -->
      <g transform="translate(300, 0)">
        <rect x="30" y="0" width="90" height="32" rx="4" stroke="#06b6d4" stroke-width="3"/>
        <rect x="40" y="45" width="70" height="10" rx="2" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="38" y="60" width="75" height="8" rx="2" stroke="#cbd5e1" stroke-width="1"/>
      </g>

      <!-- Stat 4 -->
      <g transform="translate(450, 0)">
        <rect x="30" y="0" width="90" height="32" rx="4" stroke="#06b6d4" stroke-width="3"/>
        <rect x="40" y="45" width="70" height="10" rx="2" stroke="#cbd5e1" stroke-width="1.5"/>
        <rect x="42" y="60" width="65" height="8" rx="2" stroke="#cbd5e1" stroke-width="1"/>
      </g>
    </g>

    <!-- Decorative Elements -->
    <g transform="translate(180, 210)">
      <circle cx="0" cy="0" r="14" stroke="#06b6d4" stroke-width="2" opacity="0.2"/>
      <circle cx="40" cy="0" r="10" stroke="#06b6d4" stroke-width="2" opacity="0.3"/>
      <circle cx="70" cy="0" r="6" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
      <line x1="85" y1="0" x2="135" y2="0" stroke="#06b6d4" stroke-width="1" opacity="0.4"/>
      <circle cx="150" cy="0" r="6" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
      <circle cx="180" cy="0" r="10" stroke="#06b6d4" stroke-width="2" opacity="0.3"/>
      <circle cx="220" cy="0" r="14" stroke="#06b6d4" stroke-width="2" opacity="0.2"/>
    </g>
  </g>

  <!-- Gradient Divider -->
  <defs>
    <linearGradient id="dividerGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#06b6d4;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <line x1="100" y1="350" x2="700" y2="350" stroke="url(#dividerGradient)" stroke-width="2"/>

  <!-- Footer Info -->
  <g transform="translate(100, 390)">
    <!-- Logo -->
    <rect x="0" y="20" width="100" height="28" rx="6" stroke="#f1f5f9" stroke-width="2"/>

    <!-- Menu Items (centered) -->
    <g transform="translate(180, 0)">
      <rect x="0" y="26" width="50" height="8" rx="2" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="65" y="26" width="60" height="8" rx="2" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="140" y="26" width="45" height="8" rx="2" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="200" y="26" width="55" height="8" rx="2" stroke="#cbd5e1" stroke-width="1"/>
    </g>

    <!-- Social Icons -->
    <g transform="translate(480, 24)">
      <circle cx="0" cy="0" r="14" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
      <circle cx="45" cy="0" r="14" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
      <circle cx="90" cy="0" r="14" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
      <circle cx="135" cy="0" r="14" stroke="#06b6d4" stroke-width="2" opacity="0.4"/>
    </g>
  </g>

  <!-- Copyright -->
  <line x1="100" y1="480" x2="700" y2="480" stroke="#06b6d4" stroke-width="1" opacity="0.2"/>
  <rect x="300" y="495" width="200" height="8" rx="2" stroke="#cbd5e1" stroke-width="1"/>
</svg>
