<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" fill="none">
  <!-- Main footer area -->
  <rect x="0" y="0" width="800" height="280" fill="none" stroke="#0f172a" stroke-width="1"/>

  <!-- Left side - App info & download buttons -->
  <rect x="30" y="30" width="250" height="15" rx="3" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="30" y1="55" x2="280" y2="55" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="30" y1="65" x2="270" y2="65" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="30" y1="75" x2="260" y2="75" stroke="#e2e8f0" stroke-width="1"/>

  <!-- App Store button -->
  <rect x="30" y="95" width="130" height="40" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>
  <circle cx="48" cy="115" r="8" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="68" y1="108" x2="140" y2="108" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="68" y1="118" x2="135" y2="118" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Google Play button -->
  <rect x="175" y="95" width="130" height="40" rx="8" fill="none" stroke="#1e293b" stroke-width="2"/>
  <path d="M193,105 L193,125 L203,115 Z" fill="none" stroke="#e2e8f0" stroke-width="1.5"/>
  <line x1="213" y1="108" x2="285" y2="108" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="213" y1="118" x2="280" y2="118" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- QR Code section -->
  <rect x="30" y="150" width="275" height="50" rx="8" fill="none" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="45" y="160" width="30" height="30" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <!-- QR code pattern -->
  <rect x="48" y="163" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="57" y="163" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="66" y="163" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="48" y="172" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="66" y="172" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="48" y="181" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="57" y="181" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1"/>
  <rect x="66" y="181" width="6" height="6" fill="none" stroke="#ffffff" stroke-width="1"/>
  <line x1="85" y1="165" x2="160" y2="165" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="85" y1="178" x2="180" y2="178" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- Stats -->
  <rect x="30" y="215" width="80" height="30" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <line x1="50" y1="225" x2="75" y2="225" stroke="#3b82f6" stroke-width="2"/>
  <line x1="40" y1="235" x2="80" y2="235" stroke="#e2e8f0" stroke-width="0.8"/>

  <rect x="120" y="215" width="80" height="30" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <line x1="140" y1="225" x2="165" y2="225" stroke="#3b82f6" stroke-width="2"/>
  <line x1="130" y1="235" x2="170" y2="235" stroke="#e2e8f0" stroke-width="0.8"/>

  <rect x="210" y="215" width="80" height="30" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.3"/>
  <line x1="230" y1="225" x2="255" y2="225" stroke="#3b82f6" stroke-width="2"/>
  <line x1="220" y1="235" x2="260" y2="235" stroke="#e2e8f0" stroke-width="0.8"/>

  <!-- Right side - Phone mockup -->
  <!-- Phone frame -->
  <rect x="500" y="20" width="120" height="240" rx="12" fill="none" stroke="#1e293b" stroke-width="3"/>
  <!-- Notch -->
  <rect x="545" y="25" width="30" height="8" rx="4" fill="none" stroke="#0f172a" stroke-width="1.5"/>
  <!-- Screen -->
  <rect x="510" y="45" width="100" height="200" rx="6" fill="none" stroke="#0f172a" stroke-width="1"/>
  <!-- Screen content -->
  <rect x="520" y="55" width="80" height="15" rx="3" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <rect x="520" y="80" width="35" height="35" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
  <rect x="565" y="80" width="35" height="35" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
  <rect x="520" y="125" width="80" height="25" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
  <rect x="520" y="160" width="80" height="25" rx="4" fill="none" stroke="#334155" stroke-width="1"/>
  <rect x="520" y="195" width="80" height="35" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <!-- Home indicator -->
  <rect x="545" y="237" width="30" height="2" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>

  <!-- Features section (icons below phone) -->
  <circle cx="430" cy="265" r="8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="510" cy="265" r="8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="590" cy="265" r="8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="670" cy="265" r="8" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Bottom border -->
  <line x1="0" y1="255" x2="800" y2="255" stroke="#ffffff" stroke-width="1" opacity="0.1"/>
</svg>
