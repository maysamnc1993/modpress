<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140">
  <defs>
    <linearGradient id="startupGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Gradient CTA Section -->
  <rect width="400" height="60" fill="url(#startupGrad)"/>

  <!-- Decorative Blobs -->
  <circle cx="60" cy="20" r="25" fill="#ffffff" opacity="0.1"/>
  <circle cx="340" cy="45" r="30" fill="#ffffff" opacity="0.1"/>

  <!-- CTA Content -->
  <text x="200" y="22" font-size="10" fill="#ffffff" text-anchor="middle" font-weight="bold">آماده شروع هستید؟</text>
  <text x="200" y="34" font-size="6" fill="#ffffff" text-anchor="middle" opacity="0.9">همین الان محصول ما را رایگان امتحان کنید. نیازی به کارت اعتباری نیست.</text>

  <!-- CTA Buttons -->
  <rect x="130" y="40" width="60" height="14" rx="7" fill="#ffffff"/>
  <text x="160" y="50" font-size="6" fill="#1e293b" text-anchor="middle" font-weight="bold">شروع رایگان →</text>

  <rect x="200" y="40" width="60" height="14" rx="7" fill="#ffffff" opacity="0.2" stroke="#ffffff" stroke-width="1"/>
  <text x="230" y="50" font-size="6" fill="#ffffff" text-anchor="middle" font-weight="bold">▶ مشاهده دمو</text>

  <!-- Main Footer -->
  <rect y="60" width="400" height="60" fill="#ffffff"/>

  <!-- Company Info Column -->
  <rect x="20" y="70" width="50" height="6" rx="3" fill="#1e293b"/>
  <text x="20" y="83" font-size="5" fill="#64748b">ابزارهای نوآورانه برای</text>
  <text x="20" y="89" font-size="5" fill="#64748b">رشد کسب‌وکار شما</text>
  <!-- Social Icons -->
  <rect x="20" y="96" width="8" height="8" rx="2" fill="#f3f4f6"/>
  <rect x="30" y="96" width="8" height="8" rx="2" fill="#f3f4f6"/>
  <rect x="40" y="96" width="8" height="8" rx="2" fill="#f3f4f6"/>
  <rect x="50" y="96" width="8" height="8" rx="2" fill="#f3f4f6"/>

  <!-- Products Column -->
  <text x="110" y="73" font-size="5.5" fill="#1e293b" font-weight="bold">محصولات</text>
  <text x="110" y="82" font-size="4.5" fill="#64748b">ویژگی‌ها</text>
  <text x="110" y="88" font-size="4.5" fill="#64748b">قیمت‌گذاری</text>
  <text x="110" y="94" font-size="4.5" fill="#64748b">یکپارچه‌سازی‌ها</text>
  <text x="110" y="100" font-size="4.5" fill="#64748b">API</text>

  <!-- Resources Column -->
  <text x="180" y="73" font-size="5.5" fill="#1e293b" font-weight="bold">منابع</text>
  <text x="180" y="82" font-size="4.5" fill="#64748b">وبلاگ</text>
  <text x="180" y="88" font-size="4.5" fill="#64748b">مستندات</text>
  <text x="180" y="94" font-size="4.5" fill="#64748b">آموزش‌ها</text>
  <text x="180" y="100" font-size="4.5" fill="#64748b">راهنماها</text>

  <!-- Company Column -->
  <text x="250" y="73" font-size="5.5" fill="#1e293b" font-weight="bold">شرکت</text>
  <text x="250" y="82" font-size="4.5" fill="#64748b">درباره ما</text>
  <text x="250" y="88" font-size="4.5" fill="#64748b">تیم ما</text>
  <text x="250" y="94" font-size="4.5" fill="#64748b">فرصت‌های شغلی</text>
  <text x="250" y="100" font-size="4.5" fill="#64748b">تماس با ما</text>

  <!-- Support Column -->
  <text x="320" y="73" font-size="5.5" fill="#1e293b" font-weight="bold">پشتیبانی</text>
  <text x="320" y="82" font-size="4.5" fill="#64748b">مرکز راهنما</text>
  <text x="320" y="88" font-size="4.5" fill="#64748b">انجمن کاربران</text>
  <text x="320" y="94" font-size="4.5" fill="#64748b">سوالات متداول</text>
  <text x="320" y="100" font-size="4.5" fill="#64748b">گزارش باگ</text>

  <!-- Bottom Bar -->
  <line x1="0" y1="120" x2="400" y2="120" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Copyright -->
  <text x="20" y="132" font-size="5" fill="#64748b">© 2025 Startup - تمامی حقوق محفوظ است</text>

  <!-- Legal Links -->
  <text x="230" y="132" font-size="5" fill="#64748b">حریم خصوصی</text>
  <text x="270" y="132" font-size="5" fill="#64748b">شرایط استفاده</text>
  <!-- Status Indicator -->
  <circle cx="325" cy="129" r="2" fill="#10b981"/>
  <text x="330" y="132" font-size="5" fill="#64748b">وضعیت سرویس</text>

  <!-- Back to Top (Gradient) -->
  <circle cx="380" cy="130" r="6" fill="url(#startupGrad)"/>
  <path d="M 380 132 L 380 128 M 378 130 L 380 128 L 382 130" stroke="#ffffff" stroke-width="1" fill="none"/>
</svg>
