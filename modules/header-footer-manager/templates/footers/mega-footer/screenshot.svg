<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" fill="none">
  <!-- Newsletter bar at top -->
  <rect x="0" y="0" width="800" height="50" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <rect x="20" y="15" width="200" height="10" rx="2" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="20" y="28" width="150" height="6" rx="1" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <rect x="520" y="15" width="180" height="20" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="710" y="15" width="70" height="20" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>

  <!-- Main footer area -->
  <rect x="0" y="50" width="800" height="180" fill="none" stroke="#374151" stroke-width="1"/>

  <!-- Column 1 - Logo & Contact -->
  <rect x="20" y="65" width="100" height="15" rx="3" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <line x1="20" y1="90" x2="140" y2="90" stroke="#6b7280" stroke-width="1"/>
  <line x1="20" y1="100" x2="130" y2="100" stroke="#6b7280" stroke-width="1"/>
  <circle cx="27" cy="115" r="3" fill="none" stroke="#6b7280" stroke-width="1"/>
  <line x1="35" y1="115" x2="100" y2="115" stroke="#6b7280" stroke-width="1"/>
  <circle cx="27" cy="127" r="3" fill="none" stroke="#6b7280" stroke-width="1"/>
  <line x1="35" y1="127" x2="110" y2="127" stroke="#6b7280" stroke-width="1"/>
  <!-- Social icons -->
  <circle cx="25" cy="145" r="6" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="40" cy="145" r="6" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="55" cy="145" r="6" fill="none" stroke="#6b7280" stroke-width="1.5"/>

  <!-- Column 2 - Quick Links -->
  <rect x="170" y="65" width="80" height="10" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="170" y1="85" x2="230" y2="85" stroke="#6b7280" stroke-width="1"/>
  <line x1="170" y1="95" x2="220" y2="95" stroke="#6b7280" stroke-width="1"/>
  <line x1="170" y1="105" x2="235" y2="105" stroke="#6b7280" stroke-width="1"/>
  <line x1="170" y1="115" x2="215" y2="115" stroke="#6b7280" stroke-width="1"/>
  <line x1="170" y1="125" x2="225" y2="125" stroke="#6b7280" stroke-width="1"/>

  <!-- Column 3 - Services -->
  <rect x="305" y="65" width="70" height="10" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="305" y1="85" x2="360" y2="85" stroke="#6b7280" stroke-width="1"/>
  <line x1="305" y1="95" x2="365" y2="95" stroke="#6b7280" stroke-width="1"/>
  <line x1="305" y1="105" x2="355" y2="105" stroke="#6b7280" stroke-width="1"/>
  <line x1="305" y1="115" x2="370" y2="115" stroke="#6b7280" stroke-width="1"/>
  <line x1="305" y1="125" x2="350" y2="125" stroke="#6b7280" stroke-width="1"/>

  <!-- Column 4 - Support -->
  <rect x="430" y="65" width="65" height="10" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="430" y1="85" x2="485" y2="85" stroke="#6b7280" stroke-width="1"/>
  <line x1="430" y1="95" x2="490" y2="95" stroke="#6b7280" stroke-width="1"/>
  <line x1="430" y1="105" x2="480" y2="105" stroke="#6b7280" stroke-width="1"/>
  <line x1="430" y1="115" x2="495" y2="115" stroke="#6b7280" stroke-width="1"/>

  <!-- Column 5 - App Download -->
  <rect x="545" y="65" width="100" height="10" rx="2" fill="none" stroke="#9ca3af" stroke-width="1.5"/>
  <rect x="545" y="85" width="110" height="20" rx="4" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="555" cy="95" r="5" fill="none" stroke="#6b7280" stroke-width="1"/>
  <line x1="568" y1="90" x2="640" y2="90" stroke="#6b7280" stroke-width="1"/>
  <line x1="568" y1="98" x2="625" y2="98" stroke="#6b7280" stroke-width="0.8"/>
  <rect x="545" y="112" width="110" height="20" rx="4" fill="none" stroke="#6b7280" stroke-width="1.5"/>
  <circle cx="555" cy="122" r="5" fill="none" stroke="#6b7280" stroke-width="1"/>
  <line x1="568" y1="117" x2="640" y2="117" stroke="#6b7280" stroke-width="1"/>
  <line x1="568" y1="125" x2="625" y2="125" stroke="#6b7280" stroke-width="0.8"/>

  <!-- Trust badges section -->
  <line x1="20" y1="165" x2="780" y2="165" stroke="#374151" stroke-width="1" stroke-dasharray="2,2"/>
  <rect x="20" y="175" width="70" height="18" rx="3" fill="none" stroke="#6b7280" stroke-width="1"/>
  <rect x="100" y="175" width="70" height="18" rx="3" fill="none" stroke="#6b7280" stroke-width="1"/>
  <rect x="180" y="175" width="100" height="18" rx="3" fill="none" stroke="#6b7280" stroke-width="1"/>

  <!-- Payment icons -->
  <rect x="500" y="175" width="30" height="18" rx="2" fill="none" stroke="#6b7280" stroke-width="1"/>
  <rect x="540" y="175" width="30" height="18" rx="2" fill="none" stroke="#6b7280" stroke-width="1"/>
  <rect x="580" y="175" width="30" height="18" rx="2" fill="none" stroke="#6b7280" stroke-width="1"/>
  <rect x="620" y="175" width="30" height="18" rx="2" fill="none" stroke="#6b7280" stroke-width="1"/>
  <rect x="660" y="175" width="30" height="18" rx="2" fill="none" stroke="#6b7280" stroke-width="1"/>

  <!-- Bottom bar -->
  <rect x="0" y="230" width="800" height="50" fill="none" stroke="#1e293b" stroke-width="1"/>
  <line x1="20" y1="255" x2="180" y2="255" stroke="#6b7280" stroke-width="1"/>
  <line x1="620" y1="255" x2="670" y2="255" stroke="#6b7280" stroke-width="0.8"/>
  <line x1="680" y1="255" x2="740" y2="255" stroke="#6b7280" stroke-width="0.8"/>
  <line x1="750" y1="255" x2="780" y2="255" stroke="#6b7280" stroke-width="0.8"/>
