<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80">
  <!-- Background -->
  <rect width="400" height="80" fill="#ffffff"/>

  <!-- Top Border -->
  <line x1="0" y1="0" x2="400" y2="0" stroke="#e5e7eb" stroke-width="1"/>

  <!-- Centered Layout -->

  <!-- Logo -->
  <rect x="170" y="15" width="60" height="8" rx="4" fill="#1e293b"/>

  <!-- Social Icons -->
  <g transform="translate(145, 30)">
    <circle cx="20" cy="5" r="6" fill="#f3f4f6"/>
    <text x="20" y="8" font-size="6" fill="#64748b" text-anchor="middle">𝕏</text>

    <circle cx="35" cy="5" r="6" fill="#f3f4f6"/>
    <text x="35" y="8" font-size="6" fill="#64748b" text-anchor="middle">in</text>

    <circle cx="50" cy="5" r="6" fill="#f3f4f6"/>
    <text x="50" y="8" font-size="6" fill="#64748b" text-anchor="middle">📷</text>

    <circle cx="65" cy="5" r="6" fill="#f3f4f6"/>
    <text x="65" y="8" font-size="6" fill="#64748b" text-anchor="middle">⚙</text>

    <circle cx="80" cy="5" r="6" fill="#f3f4f6"/>
    <text x="80" y="8" font-size="6" fill="#64748b" text-anchor="middle">🐙</text>
  </g>

  <!-- Legal Links -->
  <g transform="translate(0, 50)">
    <text x="120" y="5" font-size="6" fill="#64748b" text-anchor="middle">سیاست حریم خصوصی</text>
    <text x="200" y="5" font-size="6" fill="#d1d5db" text-anchor="middle">•</text>
    <text x="280" y="5" font-size="6" fill="#64748b" text-anchor="middle">شرایط استفاده</text>
  </g>

  <!-- Copyright -->
  <text x="200" y="65" font-size="6" fill="#64748b" text-anchor="middle">
    © 2025
  </text>
  <text x="225" y="65" font-size="6" fill="#1e293b" text-anchor="middle" font-weight="bold">
    Company
  </text>
  <text x="250" y="65" font-size="6" fill="#64748b" text-anchor="start">
    - تمامی حقوق محفوظ است
  </text>

  <!-- Alternative Spread Layout (shown in light outline) -->
  <g opacity="0.15">
    <rect x="10" y="10" width="380" height="60" rx="4" stroke="#64748b" stroke-width="0.5" fill="none" stroke-dasharray="2,2"/>

    <!-- Left Side -->
    <rect x="20" y="35" width="40" height="6" rx="3" fill="#1e293b"/>
    <text x="65" y="39" font-size="4.5" fill="#64748b">© 2025 Brand</text>

    <!-- Center -->
    <text x="165" y="39" font-size="4.5" fill="#64748b">حریم خصوصی</text>
    <text x="210" y="39" font-size="4.5" fill="#64748b">شرایط</text>

    <!-- Right -->
    <circle cx="320" cy="37" r="4" fill="#f3f4f6"/>
    <circle cx="335" cy="37" r="4" fill="#f3f4f6"/>
    <circle cx="350" cy="37" r="4" fill="#f3f4f6"/>
    <circle cx="365" cy="37" r="4" fill="#f3f4f6"/>
  </g>
</svg>
