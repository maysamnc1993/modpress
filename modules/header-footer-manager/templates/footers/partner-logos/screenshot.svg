      <rect x="0" y="0" width="160" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="40" y="25" width="80" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

      <rect x="180" y="0" width="160" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="220" y="25" width="80" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

      <rect x="360" y="0" width="160" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="400" y="25" width="80" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

      <rect x="540" y="0" width="160" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="580" y="25" width="80" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

      <!-- Row 2 -->
      <rect x="0" y="100" width="160" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="40" y="125" width="80" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

      <rect x="180" y="100" width="160" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="220" y="125" width="80" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

      <rect x="360" y="100" width="160" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="400" y="125" width="80" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>

      <rect x="540" y="100" width="160" height="80" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
      <rect x="580" y="125" width="80" height="30" rx="4" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
