    <rect x="350" y="0" width="80" height="10" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="350" y="20" width="60" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>
    <rect x="350" y="32" width="55" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>
    <rect x="350" y="44" width="50" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>

    <!-- Column 4: Contact -->
    <rect x="510" y="0" width="80" height="10" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="518" cy="27" r="4" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <rect x="528" y="23" width="100" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>
    <circle cx="518" cy="41" r="4" fill="none" stroke="#10b981" stroke-width="1.5"/>
    <rect x="528" y="37" width="80" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>
