    <circle cx="60" cy="70" r="8" fill="none" stroke="#10b981" stroke-width="2"/>

    <!-- Column 2: Quick Links -->
    <rect x="190" y="0" width="80" height="10" rx="1" fill="none" stroke="#1e293b" stroke-width="1.5"/>
    <rect x="190" y="20" width="60" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>
    <rect x="190" y="32" width="55" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>
    <rect x="190" y="44" width="50" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>
    <rect x="190" y="56" width="58" height="6" rx="1" fill="none" stroke="#64748b" stroke-width="1"/>

