<svg width="800" height="480" viewBox="0 0 800 480" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="480" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>

  <!-- Partner Logos Section -->
