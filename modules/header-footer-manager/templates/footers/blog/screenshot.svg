<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="500" fill="#1f2937"/>

  <!-- Newsletter Section -->
  <g transform="translate(60, 40)">
    <text x="0" y="0" font-family="Arial" font-size="22" font-weight="bold" fill="#f3f4f6">Subscribe to Our Newsletter</text>
    <text x="0" y="28" font-family="Arial" font-size="12" fill="#9ca3af">Get the latest articles and updates delivered to your inbox.</text>

    <!-- Newsletter Form -->
    <g transform="translate(400, -10)">
      <rect x="0" y="0" width="200" height="40" rx="8" fill="#374151" stroke="#4b5563" stroke-width="1"/>
      <text x="12" y="25" font-family="Arial" font-size="11" fill="#9ca3af">Enter your email</text>

      <rect x="210" y="0" width="90" height="40" rx="8" fill="#f59e0b"/>
      <text x="255" y="25" font-family="Arial" font-size="11" font-weight="bold" fill="white" text-anchor="middle">Subscribe</text>
    </g>

    <text x="400" y="60" font-family="Arial" font-size="9" fill="#9ca3af">Join 10,000+ subscribers who get our weekly newsletter.</text>
  </g>

  <line x1="60" y1="140" x2="740" y2="140" stroke="#374151" stroke-width="1"/>

  <!-- Main Footer Content -->
  <g transform="translate(60, 170)">
    <!-- Column 1: About Blog -->
    <rect x="0" y="0" width="140" height="28" rx="4" fill="#f59e0b"/>
    <text x="10" y="19" font-family="Arial" font-size="14" font-weight="bold" fill="white">Blog Magazine</text>

    <text x="0" y="50" font-family="Arial" font-size="10" fill="#9ca3af">Sharing stories, insights,</text>
    <text x="0" y="65" font-family="Arial" font-size="10" fill="#9ca3af">and inspiration from</text>
    <text x="0" y="80" font-family="Arial" font-size="10" fill="#9ca3af">around the world.</text>

    <!-- Follow Us -->
    <text x="0" y="105" font-family="Arial" font-size="10" font-weight="bold" fill="#f3f4f6">Follow Us</text>
    <circle cx="10" cy="125" r="8" fill="#9ca3af"/>
    <circle cx="35" cy="125" r="8" fill="#9ca3af"/>
    <circle cx="60" cy="125" r="8" fill="#9ca3af"/>
    <circle cx="85" cy="125" r="8" fill="#9ca3af"/>

    <!-- Column 2: Popular Posts -->
    <text x="190" y="19" font-family="Arial" font-size="12" font-weight="bold" fill="#f3f4f6">Popular Posts</text>

    <!-- Post 1 -->
    <rect x="190" y="35" width="48" height="48" rx="4" fill="#374151"/>
    <text x="245" y="47" font-family="Arial" font-size="9" fill="#f3f4f6">How to Build Amazing</text>
    <text x="245" y="59" font-family="Arial" font-size="9" fill="#f3f4f6">WordPress Sites</text>
    <text x="245" y="76" font-family="Arial" font-size="8" fill="#9ca3af">Dec 28, 2025</text>

    <!-- Post 2 -->
    <rect x="190" y="95" width="48" height="48" rx="4" fill="#374151"/>
    <text x="245" y="107" font-family="Arial" font-size="9" fill="#f3f4f6">10 Design Trends</text>
    <text x="245" y="119" font-family="Arial" font-size="9" fill="#f3f4f6">for 2025</text>
    <text x="245" y="136" font-family="Arial" font-size="8" fill="#9ca3af">Dec 26, 2025</text>

    <!-- Column 3: Categories -->
    <text x="420" y="19" font-family="Arial" font-size="12" font-weight="bold" fill="#f3f4f6">Categories</text>
    <text x="420" y="42" font-family="Arial" font-size="10" fill="#9ca3af">• Technology (24)</text>
    <text x="420" y="57" font-family="Arial" font-size="10" fill="#9ca3af">• Design (18)</text>
    <text x="420" y="72" font-family="Arial" font-size="10" fill="#9ca3af">• Business (15)</text>
    <text x="420" y="87" font-family="Arial" font-size="10" fill="#9ca3af">• Lifestyle (12)</text>
    <text x="420" y="102" font-family="Arial" font-size="10" fill="#9ca3af">• Travel (9)</text>

    <!-- Column 4: Quick Links & Tags -->
    <text x="570" y="19" font-family="Arial" font-size="12" font-weight="bold" fill="#f3f4f6">Quick Links</text>
    <text x="570" y="42" font-family="Arial" font-size="10" fill="#9ca3af">• About</text>
    <text x="570" y="57" font-family="Arial" font-size="10" fill="#9ca3af">• Contact</text>
    <text x="570" y="72" font-family="Arial" font-size="10" fill="#9ca3af">• Advertise</text>
    <text x="570" y="87" font-family="Arial" font-size="10" fill="#9ca3af">• Write for Us</text>

    <!-- Tags -->
    <text x="570" y="115" font-family="Arial" font-size="10" font-weight="bold" fill="#f3f4f6">Popular Tags</text>

    <!-- Tag Pills -->
    <rect x="570" y="125" width="50" height="20" rx="10" fill="#374151"/>
    <text x="595" y="139" font-family="Arial" font-size="8" fill="#9ca3af" text-anchor="middle">WordPress</text>

    <rect x="625" y="125" width="40" height="20" rx="10" fill="#374151"/>
    <text x="645" y="139" font-family="Arial" font-size="8" fill="#9ca3af" text-anchor="middle">Design</text>

    <rect x="570" y="150" width="35" height="20" rx="10" fill="#374151"/>
    <text x="587.5" y="164" font-family="Arial" font-size="8" fill="#9ca3af" text-anchor="middle">SEO</text>

    <rect x="610" y="150" width="55" height="20" rx="10" fill="#374151"/>
    <text x="637.5" y="164" font-family="Arial" font-size="8" fill="#9ca3af" text-anchor="middle">Development</text>
  </g>

  <!-- Bottom Bar -->
  <line x1="60" y1="400" x2="740" y2="400" stroke="#374151" stroke-width="1"/>

  <text x="60" y="425" font-family="Arial" font-size="10" fill="#9ca3af">© 2025 Blog Magazine - All rights reserved.</text>

  <text x="540" y="425" font-family="Arial" font-size="10" fill="#9ca3af">Privacy</text>
  <text x="605" y="425" font-family="Arial" font-size="10" fill="#9ca3af">Terms</text>
  <text x="660" y="425" font-family="Arial" font-size="10" fill="#9ca3af">Contact</text>

  <!-- Back to Top Button -->
  <circle cx="720" cy="460" r="18" fill="#f59e0b"/>
  <path d="M720 452 L720 468 M720 452 L715 457 M720 452 L725 457" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
