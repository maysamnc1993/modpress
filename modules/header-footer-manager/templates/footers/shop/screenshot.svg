<svg width="800" height="450" viewBox="0 0 800 450" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="450" fill="#111827"/>

  <!-- Trust Badges Bar -->
  <rect x="0" y="0" width="800" height="80" fill="#1f2937"/>

  <!-- Badge 1 -->
  <circle cx="100" cy="40" r="16" fill="#10b981"/>
  <text x="125" y="35" font-family="Arial" font-size="11" font-weight="bold" fill="#e5e7eb">Free Shipping</text>
  <text x="125" y="50" font-family="Arial" font-size="9" fill="#9ca3af">On orders over $50</text>

  <!-- Badge 2 -->
  <circle cx="300" cy="40" r="16" fill="#10b981"/>
  <text x="325" y="35" font-family="Arial" font-size="11" font-weight="bold" fill="#e5e7eb">Secure Payment</text>
  <text x="325" y="50" font-family="Arial" font-size="9" fill="#9ca3af">100% protected</text>

  <!-- Badge 3 -->
  <circle cx="500" cy="40" r="16" fill="#10b981"/>
  <text x="525" y="35" font-family="Arial" font-size="11" font-weight="bold" fill="#e5e7eb">Easy Returns</text>
  <text x="525" y="50" font-family="Arial" font-size="9" fill="#9ca3af">30 days guarantee</text>

  <!-- Badge 4 -->
  <circle cx="680" cy="40" r="16" fill="#10b981"/>
  <text x="705" y="35" font-family="Arial" font-size="11" font-weight="bold" fill="#e5e7eb">24/7 Support</text>
  <text x="705" y="50" font-family="Arial" font-size="9" fill="#9ca3af">Customer care</text>

  <line x1="0" y1="80" x2="800" x2="80" stroke="#374151" stroke-width="1"/>

  <!-- Main Footer Content -->
  <g transform="translate(60, 110)">
    <!-- Column 1: About Store -->
    <rect x="0" y="0" width="140" height="28" rx="4" fill="#10b981"/>
    <text x="10" y="18" font-family="Arial" font-size="13" font-weight="bold" fill="white">Online Shop</text>

    <text x="0" y="50" font-family="Arial" font-size="10" fill="#9ca3af">Your trusted online store for</text>
    <text x="0" y="65" font-family="Arial" font-size="10" fill="#9ca3af">quality products at great prices.</text>
    <text x="0" y="80" font-family="Arial" font-size="10" fill="#9ca3af">Fast shipping worldwide.</text>

    <!-- Contact -->
    <circle cx="8" cy="105" r="5" fill="#9ca3af"/>
    <text x="20" y="110" font-family="Arial" font-size="9" fill="#9ca3af">+1 800 123 4567</text>

    <circle cx="8" cy="125" r="5" fill="#9ca3af"/>
    <text x="20" y="130" font-family="Arial" font-size="9" fill="#9ca3af">shop@store.com</text>

    <!-- Social Icons -->
    <circle cx="10" cy="155" r="8" fill="#9ca3af"/>
    <circle cx="35" cy="155" r="8" fill="#9ca3af"/>
    <circle cx="60" cy="155" r="8" fill="#9ca3af"/>
    <circle cx="85" cy="155" r="8" fill="#9ca3af"/>

    <!-- Column 2: Shop -->
    <text x="190" y="18" font-family="Arial" font-size="12" font-weight="bold" fill="#e5e7eb">Shop</text>
    <text x="190" y="43" font-family="Arial" font-size="10" fill="#9ca3af">• New Arrivals</text>
    <text x="190" y="58" font-family="Arial" font-size="10" fill="#9ca3af">• Best Sellers</text>
    <text x="190" y="73" font-family="Arial" font-size="10" fill="#9ca3af">• Categories</text>
    <text x="190" y="88" font-family="Arial" font-size="10" fill="#9ca3af">• Sale</text>
    <text x="190" y="103" font-family="Arial" font-size="10" fill="#9ca3af">• Collections</text>

    <!-- Column 3: Customer Service -->
    <text x="360" y="18" font-family="Arial" font-size="12" font-weight="bold" fill="#e5e7eb">Customer Service</text>
    <text x="360" y="43" font-family="Arial" font-size="10" fill="#9ca3af">• Contact Us</text>
    <text x="360" y="58" font-family="Arial" font-size="10" fill="#9ca3af">• Shipping Info</text>
    <text x="360" y="73" font-family="Arial" font-size="10" fill="#9ca3af">• Returns</text>
    <text x="360" y="88" font-family="Arial" font-size="10" fill="#9ca3af">• FAQ</text>
    <text x="360" y="103" font-family="Arial" font-size="10" fill="#9ca3af">• Size Guide</text>

    <!-- Column 4: Newsletter -->
    <text x="530" y="18" font-family="Arial" font-size="12" font-weight="bold" fill="#e5e7eb">Join Our Newsletter</text>
    <text x="530" y="40" font-family="Arial" font-size="9" fill="#9ca3af">Subscribe for exclusive deals</text>
    <text x="530" y="53" font-family="Arial" font-size="9" fill="#9ca3af">and new arrivals.</text>

    <!-- Email Input -->
    <rect x="530" y="65" width="150" height="32" rx="6" fill="#1f2937" stroke="#374151" stroke-width="1"/>
    <text x="540" y="85" font-family="Arial" font-size="9" fill="#9ca3af">Enter your email</text>

    <!-- Subscribe Button -->
    <rect x="530" y="105" width="150" height="32" rx="6" fill="#10b981"/>
    <text x="557" y="125" font-family="Arial" font-size="10" font-weight="bold" fill="white">Subscribe Now</text>

    <!-- Bonus Text -->
    <text x="530" y="155" font-family="Arial" font-size="8" fill="#9ca3af">Get 10% off your first order!</text>
  </g>

  <!-- Bottom Bar -->
  <line x1="60" y1="320" x2="740" y2="320" stroke="#374151" stroke-width="1"/>

  <text x="60" y="345" font-family="Arial" font-size="10" fill="#9ca3af">© 2025 Online Shop - All rights reserved.</text>

  <!-- Payment Icons -->
  <text x="500" y="345" font-family="Arial" font-size="9" fill="#9ca3af">Secure Payment:</text>

  <!-- Mastercard -->
  <rect x="580" y="332" width="35" height="22" rx="2" fill="#252525"/>
  <circle cx="590" cy="343" r="6" fill="#EB001B"/>
  <circle cx="605" cy="343" r="6" fill="#F79E1B"/>

  <!-- Visa -->
  <rect x="620" y="332" width="35" height="22" rx="2" fill="#0E4C96"/>
  <text x="627" y="346" font-family="Arial" font-size="10" font-weight="bold" fill="white">VISA</text>

  <!-- Amex -->
  <rect x="660" y="332" width="35" height="22" rx="2" fill="#00579F"/>
  <text x="665" y="346" font-family="Arial" font-size="9" font-weight="bold" fill="white">AMEX</text>

  <!-- PayPal -->
  <rect x="700" y="332" width="35" height="22" rx="2" fill="#5F6368"/>
  <text x="706" y="346" font-family="Arial" font-size="8" font-weight="bold" fill="white">Pay</text>

  <!-- Back to Top Button -->
  <circle cx="720" cy="400" r="18" fill="#10b981"/>
  <path d="M720 392 L720 408 M720 392 L715 397 M720 392 L725 397" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
