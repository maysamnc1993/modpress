<svg width="800" height="550" viewBox="0 0 800 550" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="550" fill="#18181b"/>

  <!-- CTA Section -->
  <g transform="translate(60, 40)">
    <!-- Badge -->
    <rect x="0" y="0" width="140" height="24" rx="12" fill="#a855f733"/>
    <text x="70" y="16" font-family="Arial" font-size="9" font-weight="bold" fill="#a855f7" text-anchor="middle">LET'S WORK TOGETHER</text>

    <!-- Title -->
    <text x="0" y="55" font-family="Arial" font-size="26" font-weight="bold" fill="#fafafa">Let's Create</text>
    <text x="0" y="85" font-family="Arial" font-size="26" font-weight="bold" fill="#fafafa">Together</text>

    <!-- Description -->
    <text x="0" y="115" font-family="Arial" font-size="12" fill="#a1a1aa">Have a project in mind? Drop us a line</text>
    <text x="0" y="132" font-family="Arial" font-size="12" fill="#a1a1aa">and let's build something amazing.</text>

    <!-- Contact Links -->
    <g transform="translate(0, 155)">
      <circle cx="8" cy="8" r="6" fill="#a1a1aa"/>
      <text x="22" y="14" font-family="Arial" font-size="13" fill="#fafafa">agency@creative.com</text>

      <circle cx="218" cy="8" r="6" fill="#a1a1aa"/>
      <text x="232" y="14" font-family="Arial" font-size="13" fill="#fafafa">+1 234 567 890</text>
    </g>

    <!-- Contact Form -->
    <g transform="translate(400, 0)">
      <!-- Name & Email Fields -->
      <rect x="0" y="0" width="140" height="36" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
      <text x="12" y="24" font-family="Arial" font-size="10" fill="#71717a">Your Name</text>

      <rect x="150" y="0" width="140" height="36" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
      <text x="162" y="24" font-family="Arial" font-size="10" fill="#71717a">Your Email</text>

      <!-- Message Field -->
      <rect x="0" y="44" width="290" height="72" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1"/>
      <text x="12" y="64" font-family="Arial" font-size="10" fill="#71717a">Tell us about your project...</text>

      <!-- Submit Button -->
      <rect x="0" y="124" width="290" height="40" rx="8" fill="#a855f7"/>
      <text x="145" y="148" font-family="Arial" font-size="12" font-weight="bold" fill="white" text-anchor="middle">Send Message</text>
    </g>
  </g>

  <line x1="60" y1="270" x2="740" y2="270" stroke="#27272a" stroke-width="1"/>

  <!-- Main Footer Content -->
  <g transform="translate(60, 300)">
    <!-- Column 1: Brand & Stats (Wide) -->
    <rect x="0" y="0" width="160" height="32" rx="6" fill="#a855f7"/>
    <text x="15" y="22" font-family="Arial" font-size="15" font-weight="bold" fill="white">Creative Agency</text>

    <text x="0" y="55" font-family="Arial" font-size="11" fill="#a1a1aa">We craft award-winning digital</text>
    <text x="0" y="70" font-family="Arial" font-size="11" fill="#a1a1aa">experiences that push boundaries</text>
    <text x="0" y="85" font-family="Arial" font-size="11" fill="#a1a1aa">and drive results.</text>

    <!-- Stats -->
    <g transform="translate(0, 105)">
      <text x="0" y="0" font-family="Arial" font-size="22" font-weight="bold" fill="#a855f7">50+</text>
      <text x="0" y="18" font-family="Arial" font-size="9" fill="#a1a1aa">Awards</text>

      <text x="80" y="0" font-family="Arial" font-size="22" font-weight="bold" fill="#a855f7">200+</text>
      <text x="80" y="18" font-family="Arial" font-size="9" fill="#a1a1aa">Projects</text>

      <text x="160" y="0" font-family="Arial" font-size="22" font-weight="bold" fill="#a855f7">100+</text>
      <text x="160" y="18" font-family="Arial" font-size="9" fill="#a1a1aa">Clients</text>
    </g>

    <!-- Social Icons -->
    <circle cx="10" cy="160" r="8" fill="#a1a1aa"/>
    <circle cx="35" cy="160" r="8" fill="#a1a1aa"/>
    <circle cx="60" cy="160" r="8" fill="#a1a1aa"/>
    <circle cx="85" cy="160" r="8" fill="#a1a1aa"/>

    <!-- Column 2: Services -->
    <text x="340" y="22" font-family="Arial" font-size="13" font-weight="bold" fill="#fafafa">Services</text>
    <text x="340" y="47" font-family="Arial" font-size="10" fill="#a1a1aa">• Branding</text>
    <text x="340" y="62" font-family="Arial" font-size="10" fill="#a1a1aa">• Web Design</text>
    <text x="340" y="77" font-family="Arial" font-size="10" fill="#a1a1aa">• Development</text>
    <text x="340" y="92" font-family="Arial" font-size="10" fill="#a1a1aa">• Marketing</text>
    <text x="340" y="107" font-family="Arial" font-size="10" fill="#a1a1aa">• Consulting</text>

    <!-- Column 3: Portfolio -->
    <text x="490" y="22" font-family="Arial" font-size="13" font-weight="bold" fill="#fafafa">Portfolio</text>
    <text x="490" y="47" font-family="Arial" font-size="10" fill="#a1a1aa">• Web Apps</text>
    <text x="490" y="62" font-family="Arial" font-size="10" fill="#a1a1aa">• E-commerce</text>
    <text x="490" y="77" font-family="Arial" font-size="10" fill="#a1a1aa">• Branding</text>
    <text x="490" y="92" font-family="Arial" font-size="10" fill="#a1a1aa">• Mobile Apps</text>
    <text x="490" y="107" font-family="Arial" font-size="10" fill="#a1a1aa">• Case Studies</text>
  </g>

  <!-- Bottom Bar -->
  <line x1="60" y1="490" x2="740" y2="490" stroke="#27272a" stroke-width="1"/>

  <text x="60" y="515" font-family="Arial" font-size="10" fill="#a1a1aa">© 2025 Creative Agency - All rights reserved.</text>

  <text x="540" y="515" font-family="Arial" font-size="10" fill="#a1a1aa">Privacy Policy</text>
  <text x="650" y="515" font-family="Arial" font-size="10" fill="#a1a1aa">Terms of Service</text>

  <!-- Back to Top Button -->
  <circle cx="720" cy="510" r="18" fill="#a855f7"/>
  <path d="M720 502 L720 518 M720 502 L715 507 M720 502 L725 507" stroke="white" stroke-width="2" stroke-linecap="round"/>
</svg>
