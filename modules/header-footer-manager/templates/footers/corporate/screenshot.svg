<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120">
  <!-- Background -->
  <rect width="400" height="120" fill="#1e293b"/>

  <!-- Main Footer Content - 4 Columns -->
  <g>
    <!-- Column 1: Logo & Social -->
    <rect x="15" y="20" width="60" height="8" rx="4" fill="#ffffff" opacity="0.9"/>
    <text x="15" y="42" font-size="6" fill="#94a3b8">درباره شرکت و توضیحات</text>
    <text x="15" y="49" font-size="6" fill="#94a3b8">خدمات حرفه‌ای برای...</text>
    <!-- Social Icons -->
    <circle cx="18" cy="60" r="5" fill="#ffffff" opacity="0.2"/>
    <circle cx="28" cy="60" r="5" fill="#ffffff" opacity="0.2"/>
    <circle cx="38" cy="60" r="5" fill="#ffffff" opacity="0.2"/>
    <circle cx="48" cy="60" r="5" fill="#ffffff" opacity="0.2"/>

    <!-- Column 2: Quick Links -->
    <text x="95" y="25" font-size="7" fill="#ffffff" font-weight="bold">لینک‌های سریع</text>
    <line x1="95" y1="28" x2="150" y2="28" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <text x="95" y="37" font-size="5.5" fill="#94a3b8">درباره ما</text>
    <text x="95" y="44" font-size="5.5" fill="#94a3b8">خدمات</text>
    <text x="95" y="51" font-size="5.5" fill="#94a3b8">نمونه کارها</text>
    <text x="95" y="58" font-size="5.5" fill="#94a3b8">تماس با ما</text>

    <!-- Column 3: Departments -->
    <text x="170" y="25" font-size="7" fill="#ffffff" font-weight="bold">دپارتمان‌ها</text>
    <line x1="170" y1="28" x2="230" y2="28" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <text x="170" y="37" font-size="5.5" fill="#94a3b8">فروش و بازاریابی</text>
    <text x="170" y="44" font-size="5.5" fill="#94a3b8">مهندسی و توسعه</text>
    <text x="170" y="51" font-size="5.5" fill="#94a3b8">پشتیبانی مشتریان</text>
    <text x="170" y="58" font-size="5.5" fill="#94a3b8">منابع انسانی</text>
    <text x="170" y="65" font-size="5.5" fill="#ffffff" font-weight="bold">فرصت‌های شغلی</text>

    <!-- Column 4: Locations -->
    <text x="250" y="25" font-size="7" fill="#ffffff" font-weight="bold">شعب ما</text>
    <line x1="250" y1="28" x2="305" y2="28" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <text x="250" y="37" font-size="5.5" fill="#94a3b8">📍 دفتر مرکزی - تهران</text>
    <text x="250" y="44" font-size="5.5" fill="#94a3b8">📍 شعبه شمال - رشت</text>
    <text x="250" y="51" font-size="5.5" fill="#94a3b8">📍 شعبه غرب - تبریز</text>
    <text x="250" y="61" font-size="5.5" fill="#94a3b8">📞 021-1234567</text>
    <text x="250" y="68" font-size="5.5" fill="#94a3b8">✉️ info@company.com</text>

    <!-- Column 5: Newsletter -->
    <text x="320" y="25" font-size="7" fill="#ffffff" font-weight="bold">خبرنامه</text>
    <line x1="320" y1="28" x2="385" y2="28" stroke="#ffffff" stroke-width="0.5" opacity="0.3"/>
    <text x="320" y="37" font-size="5" fill="#94a3b8">عضویت در خبرنامه</text>
    <rect x="320" y="42" width="60" height="10" rx="4" fill="#ffffff" opacity="0.1"/>
    <text x="323" y="49" font-size="5" fill="#94a3b8">ایمیل شما</text>
    <rect x="320" y="55" width="60" height="10" rx="4" fill="#ffffff"/>
    <text x="340" y="62" font-size="5.5" fill="#1e293b" font-weight="bold">عضویت</text>
  </g>

  <!-- Bottom Bar -->
  <line x1="0" y1="85" x2="400" y2="85" stroke="#ffffff" stroke-width="0.5" opacity="0.2"/>

  <!-- Copyright -->
  <text x="20" y="98" font-size="5.5" fill="#94a3b8">© 2025 شرکت - تمامی حقوق محفوظ است</text>

  <!-- Legal Links -->
  <text x="220" y="98" font-size="5" fill="#94a3b8">حریم خصوصی</text>
  <text x="255" y="98" font-size="5" fill="#94a3b8">شرایط استفاده</text>
  <text x="295" y="98" font-size="5" fill="#94a3b8">روابط سرمایه‌گذار</text>

  <!-- Payment Icons -->
  <rect x="350" y="92" width="12" height="9" rx="1.5" fill="#ffffff" opacity="0.2"/>
  <rect x="364" y="92" width="12" height="9" rx="1.5" fill="#ffffff" opacity="0.2"/>

  <!-- Back to Top Button -->
  <circle cx="385" cy="105" r="6" fill="#ffffff"/>
  <path d="M 385 107 L 385 103 M 383 105 L 385 103 L 387 105" stroke="#1e293b" stroke-width="1" fill="none"/>
</svg>
