<svg width="800" height="600" viewBox="0 0 800 600" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="600" fill="#fafafa" stroke="#dbdbdb" stroke-width="2"/>

  <!-- Instagram Feed Section -->
  <g transform="translate(80, 40)">
    <!-- Instagram Icon and Handle -->
    <circle cx="320" cy="16" r="14" stroke="#e4405f" stroke-width="2"/>
    <circle cx="320" cy="16" r="8" stroke="#e4405f" stroke-width="1.5"/>
    <rect x="270" y="42" width="100" height="12" rx="3" stroke="#000000" stroke-width="1.5"/>

    <!-- Section Title -->
    <rect x="220" y="70" width="200" height="16" rx="4" stroke="#000000" stroke-width="2"/>
    <rect x="240" y="94" width="160" height="10" rx="3" stroke="#262626" stroke-width="1"/>
    <rect x="250" y="110" width="140" height="10" rx="3" stroke="#262626" stroke-width="1"/>

    <!-- Follow Button -->
    <rect x="260" y="134" width="120" height="16" rx="8" stroke="#e4405f" stroke-width="2"/>
    <circle cx="274" cy="142" r="4" stroke="#e4405f" stroke-width="1.5"/>

    <!-- Instagram Grid (4 columns) -->
    <g transform="translate(70, 170)">
      <!-- Row 1 -->
      <rect x="0" y="0" width="120" height="120" rx="8" stroke="#e4405f" stroke-width="2"/>
      <rect x="135" y="0" width="120" height="120" rx="8" stroke="#833ab4" stroke-width="2"/>
      <rect x="270" y="0" width="120" height="120" rx="8" stroke="#fd1d1d" stroke-width="2"/>
      <rect x="405" y="0" width="120" height="120" rx="8" stroke="#f56040" stroke-width="2"/>

      <!-- Row 2 -->
      <rect x="0" y="135" width="120" height="120" rx="8" stroke="#fcaf45" stroke-width="2"/>
      <rect x="135" y="135" width="120" height="120" rx="8" stroke="#833ab4" stroke-width="2"/>
      <rect x="270" y="135" width="120" height="120" rx="8" stroke="#e4405f" stroke-width="2"/>
      <rect x="405" y="135" width="120" height="120" rx="8" stroke="#fd1d1d" stroke-width="2"/>

      <!-- Image placeholders -->
      <circle cx="60" cy="60" r="20" stroke="#e4405f" stroke-width="1.5" opacity="0.3"/>
      <circle cx="195" cy="60" r="20" stroke="#833ab4" stroke-width="1.5" opacity="0.3"/>
      <circle cx="330" cy="60" r="20" stroke="#fd1d1d" stroke-width="1.5" opacity="0.3"/>
      <circle cx="465" cy="60" r="20" stroke="#f56040" stroke-width="1.5" opacity="0.3"/>

      <circle cx="60" cy="195" r="20" stroke="#fcaf45" stroke-width="1.5" opacity="0.3"/>
      <circle cx="195" cy="195" r="20" stroke="#833ab4" stroke-width="1.5" opacity="0.3"/>
      <circle cx="330" cy="195" r="20" stroke="#e4405f" stroke-width="1.5" opacity="0.3"/>
      <circle cx="465" cy="195" r="20" stroke="#fd1d1d" stroke-width="1.5" opacity="0.3"/>
    </g>
  </g>

  <!-- Bottom Bar -->
  <line x1="40" y1="515" x2="760" y2="515" stroke="#dbdbdb" stroke-width="1"/>

  <g transform="translate(80, 540)">
    <!-- Logo -->
    <rect x="0" y="0" width="80" height="24" rx="4" stroke="#000000" stroke-width="1.5"/>

    <!-- Menu Items -->
    <rect x="120" y="8" width="50" height="8" rx="2" stroke="#262626" stroke-width="1"/>
    <rect x="180" y="8" width="60" height="8" rx="2" stroke="#262626" stroke-width="1"/>
    <rect x="250" y="8" width="45" height="8" rx="2" stroke="#262626" stroke-width="1"/>
    <rect x="305" y="8" width="55" height="8" rx="2" stroke="#262626" stroke-width="1"/>

    <!-- Copyright -->
    <rect x="440" y="8" width="140" height="8" rx="2" stroke="#6b7280" stroke-width="1"/>

    <!-- Social Icons -->
    <circle cx="610" cy="12" r="10" stroke="#262626" stroke-width="1.5"/>
    <circle cx="640" cy="12" r="10" stroke="#262626" stroke-width="1.5"/>
    <circle cx="670" cy="12" r="10" stroke="#262626" stroke-width="1.5"/>
  </g>
</svg>
