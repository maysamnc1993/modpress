<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="400" fill="#ffffff" stroke="#e5e7eb" stroke-width="2"/>

  <!-- Divider -->
  <defs>
    <linearGradient id="topDivider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#e5e7eb;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <line x1="100" y1="0" x2="700" y2="0" stroke="url(#topDivider)" stroke-width="1"/>

  <!-- Stacked Layout -->
  <g transform="translate(250, 80)">
    <!-- Logo -->
    <rect x="80" y="0" width="140" height="36" rx="8" stroke="#111827" stroke-width="2"/>

    <!-- Tagline -->
    <rect x="95" y="50" width="110" height="8" rx="2" stroke="#6b7280" stroke-width="1"/>

    <!-- Menu Items -->
    <g transform="translate(60, 80)">
      <rect x="0" y="0" width="50" height="8" rx="2" stroke="#6b7280" stroke-width="1"/>
      <rect x="65" y="0" width="60" height="8" rx="2" stroke="#6b7280" stroke-width="1"/>
      <rect x="140" y="0" width="45" height="8" rx="2" stroke="#6b7280" stroke-width="1"/>
    </g>

    <!-- Social Icons (outlined style) -->
    <g transform="translate(80, 115)">
      <circle cx="0" cy="0" r="12" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="40" cy="0" r="12" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="80" cy="0" r="12" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="120" cy="0" r="12" stroke="#3b82f6" stroke-width="1.5"/>
    </g>

    <!-- Copyright -->
    <rect x="75" y="155" width="150" height="8" rx="2" stroke="#6b7280" stroke-width="1"/>
  </g>

  <!-- Single Line Layout (shown below as alternative) -->
  <line x1="100" y1="270" x2="700" y2="270" stroke="#e5e7eb" stroke-width="1"/>

  <g transform="translate(100, 300)">
    <!-- Logo Left -->
    <rect x="0" y="20" width="100" height="28" rx="6" stroke="#111827" stroke-width="2"/>
    <rect x="115" y="30" width="90" height="6" rx="2" stroke="#6b7280" stroke-width="1"/>

    <!-- Menu Center -->
    <g transform="translate(250, 0)">
      <rect x="0" y="32" width="45" height="6" rx="2" stroke="#6b7280" stroke-width="1"/>
      <rect x="55" y="32" width="55" height="6" rx="2" stroke="#6b7280" stroke-width="1"/>
      <rect x="120" y="32" width="40" height="6" rx="2" stroke="#6b7280" stroke-width="1"/>
    </g>

    <!-- Social + Copyright Right -->
    <g transform="translate(470, 24)">
      <circle cx="0" cy="10" r="10" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="32" cy="10" r="10" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="64" cy="10" r="10" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="96" cy="10" r="10" stroke="#3b82f6" stroke-width="1.5"/>

      <rect x="140" y="8" width="90" height="6" rx="2" stroke="#6b7280" stroke-width="1"/>
    </g>
  </g>
</svg>
