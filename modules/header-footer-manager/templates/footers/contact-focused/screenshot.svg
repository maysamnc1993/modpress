  <rect x="50" y="203" width="80" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1"/>
  <line x1="40" y1="220" x2="220" y2="220" stroke="#334155" stroke-width="0.8"/>
  <line x1="40" y1="232" x2="210" y2="232" stroke="#334155" stroke-width="0.8"/>
  <line x1="40" y1="244" x2="195" y2="244" stroke="#334155" stroke-width="0.8"/>

  <!-- Right side - Contact form -->
  <rect x="380" y="55" width="390" height="205" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <rect x="395" y="68" width="160" height="10" rx="2" fill="none" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Form fields -->
  <!-- Name & Email inputs -->
  <line x1="395" y1="92" x2="430" y2="92" stroke="#0f172a" stroke-width="1"/>
  <rect x="395" y="98" width="165" height="18" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>
  <line x1="575" y1="92" x2="610" y2="92" stroke="#0f172a" stroke-width="1"/>
  <rect x="575" y="98" width="165" height="18" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>

  <!-- Subject input -->
  <line x1="395" y1="128" x2="440" y2="128" stroke="#0f172a" stroke-width="1"/>
  <rect x="395" y="134" width="345" height="18" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>

  <!-- Message textarea -->
  <line x1="395" y1="164" x2="450" y2="164" stroke="#0f172a" stroke-width="1"/>
  <rect x="395" y="170" width="345" height="45" rx="4" fill="none" stroke="#3b82f6" stroke-width="1" opacity="0.5"/>

  <!-- Submit button -->
  <rect x="395" y="225" width="345" height="24" rx="6" fill="none" stroke="#3b82f6" stroke-width="2"/>
  <line x1="545" y1="237" x2="560" y2="237" stroke="#3b82f6" stroke-width="2"/>
  <polyline points="555,233 560,237 555,241" fill="none" stroke="#3b82f6" stroke-width="2"/>

  <!-- Bottom section with logo and links -->
  <line x1="30" y1="265" x2="770" y2="265" stroke="#e2e8f0" stroke-width="1"/>
