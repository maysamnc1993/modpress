<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" fill="none">
  <!-- Main footer area -->
  <rect x="0" y="0" width="800" height="280" fill="none" stroke="#f8fafc" stroke-width="1"/>

  <!-- Header section -->
  <rect x="250" y="15" width="300" height="12" rx="2" fill="none" stroke="#0f172a" stroke-width="2"/>
  <line x1="280" y1="35" x2="520" y2="35" stroke="#334155" stroke-width="1"/>

  <!-- Left side - Contact cards -->
  <!-- Phone card -->
  <rect x="30" y="55" width="160" height="60" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <rect x="40" y="63" width="18" height="18" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="49" cy="72" r="4" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <rect x="40" y="88" width="35" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1"/>
  <line x1="40" y1="102" x2="120" y2="102" stroke="#334155" stroke-width="1.5"/>

  <!-- Email card -->
  <rect x="200" y="55" width="160" height="60" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <rect x="210" y="63" width="18" height="18" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="216" y="69" width="6" height="4" rx="1" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <rect x="210" y="88" width="30" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1"/>
  <line x1="210" y1="102" x2="310" y2="102" stroke="#334155" stroke-width="1.5"/>

  <!-- Address card -->
  <rect x="30" y="125" width="330" height="60" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
  <rect x="40" y="133" width="18" height="18" rx="4" fill="none" stroke="#3b82f6" stroke-width="1.5"/>
  <circle cx="49" cy="142" r="5" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <circle cx="49" cy="142" r="2.5" fill="none" stroke="#3b82f6" stroke-width="1"/>
  <rect x="40" y="158" width="40" height="8" rx="2" fill="none" stroke="#0f172a" stroke-width="1"/>
  <line x1="40" y1="172" x2="200" y2="172" stroke="#334155" stroke-width="1"/>

  <!-- Working hours card -->
  <rect x="30" y="195" width="330" height="65" rx="6" fill="none" stroke="#3b82f6" stroke-width="1.5" opacity="0.3"/>
