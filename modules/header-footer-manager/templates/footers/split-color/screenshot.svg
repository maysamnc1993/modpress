<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" fill="none">
  <!-- Main split footer area -->
  <!-- Left side background -->
  <path d="M0,0 L480,0 L320,180 L0,180 Z" fill="none" stroke="#1e293b" stroke-width="1"/>

  <!-- Right side background -->
  <path d="M480,0 L800,0 L800,180 L320,180 Z" fill="none" stroke="#3b82f6" stroke-width="1"/>

  <!-- Diagonal divider line -->
  <line x1="480" y1="0" x2="320" y2="180" stroke="#ffffff" stroke-width="1" opacity="0.3"/>

  <!-- Left Side Content -->
  <rect x="30" y="20" width="100" height="15" rx="3" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="30" y="50" width="140" height="10" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="30" y1="70" x2="200" y2="70" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="30" y1="80" x2="190" y2="80" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="30" y1="90" x2="185" y2="90" stroke="#ffffff" stroke-width="1" opacity="0.9"/>

  <!-- CTA Button -->
  <rect x="30" y="105" width="100" height="24" rx="6" fill="none" stroke="#ffffff" stroke-width="2"/>
  <line x1="95" y1="117" x2="110" y2="117" stroke="#ffffff" stroke-width="2"/>
  <polyline points="105,113 110,117 105,121" fill="none" stroke="#ffffff" stroke-width="2"/>

  <!-- Contact info -->
  <circle cx="36" cy="145" r="3" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="43" y1="145" x2="110" y2="145" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <circle cx="36" cy="158" r="3" fill="none" stroke="#ffffff" stroke-width="1" opacity="0.9"/>
  <line x1="43" y1="158" x2="120" y2="158" stroke="#ffffff" stroke-width="1" opacity="0.9"/>

  <!-- Right Side Content - Column 1 -->
  <rect x="360" y="20" width="70" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="360" y1="38" x2="410" y2="38" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="360" y1="47" x2="405" y2="47" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="360" y1="56" x2="415" y2="56" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="360" y1="65" x2="400" y2="65" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="360" y1="74" x2="410" y2="74" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>

  <!-- Right Side Content - Column 2 -->
  <rect x="480" y="20" width="65" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="480" y1="38" x2="525" y2="38" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="480" y1="47" x2="530" y2="47" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="480" y1="56" x2="520" y2="56" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="480" y1="65" x2="535" y2="65" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>

  <!-- Right Side Content - Column 3 -->
  <rect x="590" y="20" width="65" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="590" y1="38" x2="635" y2="38" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="590" y1="47" x2="640" y2="47" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="590" y1="56" x2="630" y2="56" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <line x1="590" y1="65" x2="645" y2="65" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>

  <!-- Newsletter Section -->
  <rect x="480" y="95" width="75" height="9" rx="2" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <line x1="480" y1="112" x2="600" y2="112" stroke="#ffffff" stroke-width="0.8" opacity="0.9"/>
  <rect x="480" y="123" width="200" height="18" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="690" y="123" width="60" height="18" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Social Icons -->
  <rect x="480" y="152" width="20" height="20" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="508" y="152" width="20" height="20" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="536" y="152" width="20" height="20" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>
  <rect x="564" y="152" width="20" height="20" rx="4" fill="none" stroke="#ffffff" stroke-width="1.5"/>

  <!-- Bottom bar -->
  <rect x="0" y="180" width="800" height="40" fill="none" stroke="#0f172a" stroke-width="1"/>
  <line x1="30" y1="200" x2="160" y2="200" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="600" y1="200" x2="660" y2="200" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="670" y1="200" x2="740" y2="200" stroke="#94a3b8" stroke-width="0.8"/>
  <line x1="750" y1="200" x2="780" y2="200" stroke="#94a3b8" stroke-width="0.8"/>
</svg>
