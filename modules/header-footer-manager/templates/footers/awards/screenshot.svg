        <path d="M100 35 L104 45 L115 46 L107 54 L109 65 L100 60 L91 65 L93 54 L85 46 L96 45 Z" fill="none" stroke="#f59e0b" stroke-width="1.5"/>
        <line x1="90" y1="70" x2="95" y2="95" stroke="#f59e0b" stroke-width="2"/>
