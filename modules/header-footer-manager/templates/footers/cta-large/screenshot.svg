<svg width="800" height="700" viewBox="0 0 800 700" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="800" height="700" fill="#111827"/>

  <!-- Large CTA Section -->
  <g transform="translate(100, 50)">
    <!-- CTA Card -->
    <rect x="0" y="0" width="600" height="340" rx="16" stroke="#10b981" stroke-width="2" opacity="0.4"/>

    <!-- Badge -->
    <rect x="200" y="30" width="200" height="16" rx="8" stroke="#10b981" stroke-width="1.5"/>

    <!-- Main Heading -->
    <rect x="120" y="66" width="360" height="24" rx="4" stroke="#ffffff" stroke-width="2"/>

    <!-- Description Lines -->
    <rect x="100" y="110" width="400" height="10" rx="3" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="130" y="128" width="340" height="10" rx="3" stroke="#9ca3af" stroke-width="1.5"/>
    <rect x="150" y="146" width="300" height="10" rx="3" stroke="#9ca3af" stroke-width="1.5"/>

    <!-- Buttons -->
    <g transform="translate(140, 180)">
      <!-- Primary Button -->
      <rect x="0" y="0" width="150" height="20" rx="10" stroke="#10b981" stroke-width="2"/>
      <path d="M140 10 L146 10 M143 7 L146 10 L143 13" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- Secondary Button -->
      <rect x="170" y="0" width="120" height="20" rx="10" stroke="#6b7280" stroke-width="2"/>
    </g>

    <!-- Feature Checkmarks -->
    <g transform="translate(80, 230)">
      <circle cx="6" cy="6" r="5" stroke="#10b981" stroke-width="1.5"/>
      <path d="M4 6 L6 8 L9 4" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="18" y="3" width="90" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>

      <circle cx="136" cy="6" r="5" stroke="#10b981" stroke-width="1.5"/>
      <path d="M134 6 L136 8 L139 4" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="148" y="3" width="70" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>

      <circle cx="6" cy="30" r="5" stroke="#10b981" stroke-width="1.5"/>
      <path d="M4 30 L6 32 L9 28" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="18" y="27" width="60" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>

      <circle cx="136" cy="30" r="5" stroke="#10b981" stroke-width="1.5"/>
      <path d="M134 30 L136 32 L139 28" stroke="#10b981" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="148" y="27" width="100" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>
    </g>
  </g>

  <!-- Divider -->
  <line x1="100" y1="430" x2="700" y2="430" stroke="#6b7280" stroke-width="1" opacity="0.3"/>

  <!-- Footer Info Section -->
  <g transform="translate(100, 460)">
    <!-- Column 1: Logo & About -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="90" height="24" rx="6" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="0" y="36" width="120" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>
      <rect x="0" y="48" width="100" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>
      <rect x="0" y="60" width="110" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>
    </g>

    <!-- Column 2: Quick Links -->
    <g transform="translate(160, 0)">
      <rect x="0" y="4" width="80" height="10" rx="3" stroke="#ffffff" stroke-width="1.5"/>
      <rect x="0" y="30" width="60" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>
      <rect x="0" y="42" width="70" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>
      <rect x="0" y="54" width="55" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>
      <rect x="0" y="66" width="65" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>
    </g>

    <!-- Column 3: Contact -->
    <g transform="translate(310, 0)">
      <rect x="0" y="4" width="70" height="10" rx="3" stroke="#ffffff" stroke-width="1.5"/>

      <!-- Email -->
      <circle cx="4" cy="34" r="4" stroke="#9ca3af" stroke-width="1"/>
      <rect x="14" y="31" width="100" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>

      <!-- Phone -->
      <circle cx="4" cy="50" r="4" stroke="#9ca3af" stroke-width="1"/>
      <rect x="14" y="47" width="80" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>

      <!-- Address -->
      <circle cx="4" cy="66" r="4" stroke="#9ca3af" stroke-width="1"/>
      <rect x="14" y="63" width="90" height="6" rx="2" stroke="#9ca3af" stroke-width="1"/>
    </g>

    <!-- Column 4: Social -->
    <g transform="translate(490, 0)">
      <rect x="0" y="4" width="60" height="10" rx="3" stroke="#ffffff" stroke-width="1.5"/>

      <circle cx="8" cy="38" r="10" stroke="#6b7280" stroke-width="1.5" opacity="0.6"/>
      <circle cx="36" cy="38" r="10" stroke="#6b7280" stroke-width="1.5" opacity="0.6"/>
      <circle cx="64" cy="38" r="10" stroke="#6b7280" stroke-width="1.5" opacity="0.6"/>
      <circle cx="92" cy="38" r="10" stroke="#6b7280" stroke-width="1.5" opacity="0.6"/>
    </g>
  </g>

  <!-- Copyright -->
  <line x1="100" y1="590" x2="700" y2="590" stroke="#6b7280" stroke-width="1" opacity="0.3"/>
  <rect x="300" y="610" width="200" height="8" rx="2" stroke="#9ca3af" stroke-width="1"/>
</svg>
